  <style id="duplicate-cleaner-style">
    #clean-duplicate-pokemon{margin-left:auto;padding:6px 10px;border:1px solid #d7a746;border-radius:999px;background:#322817;color:#ffd974;font:800 11px/1 system-ui}
  </style>
  <script>
    (function () {
      function installDuplicateCleaner() {
        var screen = document.querySelector('#screen-team.active');
        if (!screen || screen.querySelector('#clean-duplicate-pokemon')) return;
        var anchor = screen.querySelector('.pc-filters,.pc-sticky,.map-head,h2');
        if (!anchor) return;
        var button = document.createElement('button');
        button.id = 'clean-duplicate-pokemon'; button.type = 'button';
        button.textContent = 'Dọn Pokémon trùng';
        button.title = 'Giữ tối đa 2 Pokémon thường cùng loài; không xóa shiny';
        button.onclick = function () {
          var P = window.PokeCatch, Game = P?.Game, S = Game?.S;
          if (!S?.mons) return;
          var groups = new Map();
          S.mons.filter(function (mon) { return mon && !mon.shiny; }).forEach(function (mon) {
            var list = groups.get(+mon.id) || []; list.push(mon); groups.set(+mon.id, list);
          });
          var extras = [];
          groups.forEach(function (list) {
            if (list.length <= 2) return;
            list.sort(function (a, b) {
              function priority(mon) { return (S.buddy?.uid === mon.uid ? 1000000 : 0) + (S.team.includes(mon.uid) ? 500000 : 0) + (+mon.level || 0) * 100 + (+mon.caughtAt || 0) / 1e13; }
              return priority(b) - priority(a);
            });
            extras.push.apply(extras, list.slice(2));
          });
          if (!extras.length) { P.UI?.toast?.('Không có Pokémon thường bị trùng quá 2 con.'); return; }
          if (!confirm('Dọn ' + extras.length + ' Pokémon trùng? Game sẽ giữ Buddy, Pokémon trong Team và 2 con cấp cao nhất. Shiny không bị xóa.')) return;
          var removed = 0;
          extras.forEach(function (mon) {
            var teamIndex = S.team.indexOf(mon.uid);
            if (teamIndex >= 0 && S.team.length > 1) S.team.splice(teamIndex, 1);
            if (Game.releaseMon(mon.uid)) removed++;
          });
          if (S.teamSets?.list && Number.isInteger(S.teamSets.on) && S.teamSets.on >= 0) S.teamSets.list[S.teamSets.on] = S.team.slice();
          Game.save(); P.Screens?.team?.render?.(); P.Screens?.adventure?.render?.(); P.App?.refresh?.();
          P.UI?.toast?.('Đã dọn ' + removed + ' Pokémon trùng; mỗi loài thường giữ tối đa 2 con.');
        };
        if (anchor.matches('.pc-filters,.map-head')) anchor.appendChild(button); else anchor.parentElement?.insertBefore(button, anchor.nextSibling);
      }
      new MutationObserver(installDuplicateCleaner).observe(document.body,{childList:true,subtree:true});
      setInterval(installDuplicateCleaner,1000);
    })();
  </script>

  <script>
    (function () {
      var storageKey = 'pokecatch.masterBalls.v1';
      var installed = false;
      var replaying = false;
      function installMasterBall() {
        var P = window.PokeCatch, Game = P?.Game, Config = P?.CONFIG;
        if (!Game?.S || !Config?.SHOP || installed) return false;
        installed = true;
        P.ITEM_NAMES['master-ball'] = 'Master Ball';
        var saved = 0;
        try { saved = Math.max(0, Math.floor(+localStorage.getItem(storageKey) || 0)); } catch (_) {}
        var current = Math.max(0, Game.itemCount('master-ball') || 0);
        if (saved > current) Game.addItem('master-ball', saved - current);
        var lastThrows = +Game.S.stats?.throws || 0, lastCaught = +Game.S.stats?.caught || 0, lastCount = -1;
        var nativeRandom = Math.random;
        Math.random = function () {
          if ((Game.itemCount('master-ball') || 0) > 0) {
            var stack = new Error().stack || '';
            if (/\bJn\b/.test(stack)) return 0;
          }
          return nativeRandom();
        };

        function injectShopCard() {
          var grid = document.querySelector('#screen-shop.active .sh-grid');
          if (!grid || grid.querySelector('[data-id="master-ball"]')) return;
          var count = Math.max(0, Game.itemCount('master-ball') || 0);
          var card = document.createElement('div');
          card.className = 'sh-item master-ball-shop';
          card.dataset.id = 'master-ball';
          card.innerHTML = '<div class="sh-top"><div class="sh-ic"><img src="assets/items/master-ball.png" alt=""></div><div class="sh-name"><h4>Master Ball</h4><small>Bắt Pokémon 100%. Tự động dùng cho lần bắt kế tiếp.</small></div></div><div class="sh-bottom"><span class="sh-owned">Đang có: <b>' + count + '</b></span><button class="btn primary buy">500,000 ₽</button></div>';
          card.querySelector('button').onclick = function () {
            if ((Game.S.money || 0) < 500000) { P.UI?.toast?.('Không đủ 500,000 ₽'); return; }
            Game.S.money -= 500000;
            Game.addItem('master-ball', 1);
            Game.save();
            try { localStorage.setItem(storageKey, String(Game.itemCount('master-ball') || 0)); } catch (_) {}
            P.Sfx?.buy?.();
            P.UI?.toast?.('Đã mua Master Ball! Lần bắt kế tiếp chắc chắn thành công.');
            P.App?.refreshHeader?.();
            card.remove(); injectShopCard();
          };
          grid.prepend(card);
        }
        new MutationObserver(injectShopCard).observe(document.body, {childList:true,subtree:true});
        injectShopCard();
        setInterval(function () {
          var count = Math.max(0, Game.itemCount('master-ball') || 0);
          var throwsNow = +Game.S.stats?.throws || 0, caughtNow = +Game.S.stats?.caught || 0;
          var used = Math.min(Math.max(0, throwsNow - lastThrows), Math.max(0, caughtNow - lastCaught));
          if (used > 0 && count > 0) {
            Game.addItem('master-ball', -Math.min(used, count));
            count = Math.max(0, Game.itemCount('master-ball') || 0);
            Game.save();
            P.UI?.toast?.('Master Ball đã bắt Pokémon thành công!');
          }
          lastThrows = throwsNow; lastCaught = caughtNow;
          if (count !== lastCount) {
            lastCount = count;
            try { localStorage.setItem(storageKey, String(count)); } catch (_) {}
          }
        }, 100);
        Game.save(); injectShopCard(); return true;
      }
      var installTimer = setInterval(function () { if (installMasterBall()) clearInterval(installTimer); }, 250);
      document.addEventListener('click', function (event) {
        if (replaying || event.target.closest('[data-loop]')) return;
        var row = event.target.closest('#map-root .mp-row.done[data-ch]');
        if (!row) return;
        var chapter = row.dataset.ch;
        replaying = true;
        setTimeout(function () {
          var go = document.querySelector('#map-root .mp-go[data-go="' + CSS.escape(chapter) + '"]');
          if (go && !go.disabled) go.click();
          replaying = false;
        }, 80);
      });
    })();
  </script>

  <script>
    (function () {
      const VITAMINS = {
        'hp-up':   { stat:'hp',  label:'HP Up',   statLabel:'HP',       price:10000 },
        protein:  { stat:'atk', label:'Protein', statLabel:'Attack',   price:10000 },
        iron:     { stat:'def', label:'Iron',    statLabel:'Defense',  price:10000 },
        calcium:  { stat:'spa', label:'Calcium', statLabel:'Sp. Atk',  price:10000 },
        zinc:     { stat:'spd', label:'Zinc',    statLabel:'Sp. Def',  price:10000 },
        carbos:   { stat:'spe', label:'Carbos',  statLabel:'Speed',    price:10000 }
      };
      const STAT_ORDER = ['hp','atk','def','spa','spd','spe'];
      let selectedUid = null;
      let megaList = [];

      function trackSelectedPokemon(P) {
        const UI=P?.UI;
        if(!UI?.monDetail||UI.monDetail.__tracksSelectedUid)return;
        const native=UI.monDetail;
        const wrapped=function(uid){selectedUid=uid;return native.apply(this,arguments);};
        Object.defineProperty(wrapped,'__tracksSelectedUid',{value:true});
        UI.monDetail=wrapped;
      }

      document.addEventListener('pointerdown', function (event) {
        const holder = event.target.closest('#pc-grid [data-uid],#team-slots [data-uid],#screen-team [data-uid]');
        if (holder?.dataset.uid) selectedUid = holder.dataset.uid;
      }, true);

      function totalEv(mon) {
        return STAT_ORDER.reduce((sum, key) => sum + Math.max(0, +(mon.vitamins?.[key] || 0)), 0);
      }

      function patchStats(P) {
        const G = P.Game;
        if (!G || G.__vitaminStatsInstalled) return false;
        const nativeStats = G.statsOf.bind(G);
        const nativeMaxHp = G.maxHp.bind(G);
        G.statsOf = function (mon) {
          const result = nativeStats(mon);
          const level = Math.max(1, G.lvl(mon));
          for (const key of STAT_ORDER) {
            const ev = Math.min(252, Math.max(0, +(mon?.vitamins?.[key] || 0)));
            result[key] += Math.floor((ev / 4) * level / 100);
          }
          return result;
        };
        G.maxHp = function (mon) {
          const level = Math.max(1, G.lvl(mon));
          const ev = Math.min(252, Math.max(0, +(mon?.vitamins?.hp || 0)));
          return nativeMaxHp(mon) + Math.floor((ev / 4) * level / 100);
        };
        G.curHp = function (mon) { return mon.hp == null ? G.maxHp(mon) : Math.min(mon.hp, G.maxHp(mon)); };
        Object.defineProperty(G, '__vitaminStatsInstalled', { value:true });
        window.__restoreNativeRegExpTest?.();
        return true;
      }

      function refreshStatNumbers(modal, mon, changedStat) {
        const G = window.PokeCatch.Game, stats = G.statsOf(mon), maxHp = G.maxHp(mon), curHp = G.curHp(mon);
        const bars = modal.querySelector('.stats-slot .statbars');
        if (!bars) return;
        const values = bars.querySelectorAll(':scope > b');
        STAT_ORDER.forEach(function (key, index) {
          if (!values[index]) return;
          values[index].textContent = key === 'hp' ? curHp + '/' + maxHp : stats[key];
          if (key === changedStat) {
            values[index].classList.remove('vit-flash'); void values[index].offsetWidth; values[index].classList.add('vit-flash');
          }
        });
        const total = STAT_ORDER.reduce((sum,key) => sum + (key === 'hp' ? maxHp : stats[key]), 0);
        const totalNode = modal.querySelector('.team-stats-panel .dc-tot');
        if (totalNode) totalNode.innerHTML = 'Total <b>' + total + '</b>';
        const hpNow = modal.querySelector('.hp-now'); if (hpNow) hpNow.textContent = curHp + '/' + maxHp;
      }

      function installVitaminPanel(modal) {
        if (modal.querySelector('.vitamin-panel')) return;
        const P = window.PokeCatch, G = P?.Game;
        let mon = selectedUid && G?.getMon(selectedUid);
        if (!mon) {
          const name = modal.querySelector('h2')?.textContent?.trim();
          mon = G?.allMons?.().find(m => G.DEX[m.id]?.name === name);
        }
        if (!mon) return;
        const panel = document.createElement('div'); panel.className = 'vitamin-panel';
        const update = function () {
          const used = totalEv(mon);
          panel.innerHTML = '<h4>VITAMINS <small>EV ' + used + '/510</small></h4><div class="vitamin-grid"></div>';
          const grid = panel.querySelector('.vitamin-grid');
          Object.entries(VITAMINS).forEach(function ([id, info]) {
            const amount = G.itemCount(id) || 0, statEv = +(mon.vitamins?.[info.stat] || 0);
            const button = document.createElement('button'); button.type='button'; button.className='vitamin-use';
            button.disabled = amount <= 0 || statEv >= 252 || used >= 510;
            button.innerHTML='<img src="assets/items/'+id+'.png" alt=""><span>'+info.label+'<small>'+info.statLabel+' · ×'+amount+' · EV '+statEv+'/252</small></span>';
            button.onclick=function(){
              const room=Math.min(10,252-statEv,510-totalEv(mon));
              if(room<=0||G.itemCount(id)<=0)return;
              const oldMax=G.maxHp(mon),oldHp=G.curHp(mon);
              mon.vitamins ||= {}; mon.vitamins[info.stat]=(+(mon.vitamins[info.stat]||0))+room;
              if(info.stat==='hp'){const newMax=G.maxHp(mon);mon.hp=Math.max(1,Math.round(oldHp/Math.max(1,oldMax)*newMax));}
              G.addItem(id,-1); G.save(); P.Sfx?.upgrade?.(1); P.UI?.toast?.(info.label+' tăng '+info.statLabel+' của '+G.DEX[mon.id].name+'!');
              button.classList.add('boost'); refreshStatNumbers(modal,mon,info.stat); update();
            };
            grid.appendChild(button);
          });
        };
        update();
        const statsPanel=modal.querySelector('.team-stats-panel,.stats-slot')?.closest('.dc-sec');
        (statsPanel||modal.querySelector('.fam-sec')||modal.querySelector('.item-actions'))?.insertAdjacentElement('afterend',panel);
      }

      function installMegaPanel(modal) {
        if (modal.querySelector('.mega-evolve-panel') || !megaList.length) return;
        const P=window.PokeCatch,G=P?.Game;
        let mon=selectedUid&&G?.getMon?.(selectedUid);
        if(!mon){
          const name=modal.querySelector('h2')?.textContent?.trim();
          mon=G?.allMons?.().find(m=>G.DEX[m.id]?.name===name);
        }
        if(!mon)return;
        const choices=megaList.filter(m=>+m.base===+mon.id);
        if(!choices.length)return;
        const panel=document.createElement('div');panel.className='mega-evolve-panel';
        panel.innerHTML='<h4>MEGA EVOLUTION</h4><div class="mega-evolve-grid"></div>';
        const grid=panel.querySelector('.mega-evolve-grid');
        for(const mega of choices){
          const count=G.itemCount(mega.stone)||0;
          const btn=document.createElement('button');btn.type='button';btn.className='mega-evolve-use';
          btn.disabled=count<=0;
          btn.innerHTML='<img src="assets/items/'+mega.stone+'.png" alt=""><span>'+mega.name+'<small>'+mega.stoneName+' ×'+count+'</small></span>';
          btn.title=count>0?'Dùng '+mega.stoneName+' để tiến hóa':'Chưa có '+mega.stoneName;
          btn.onclick=function(){
            if(btn.dataset.busy==='1')return;
            btn.dataset.busy='1';btn.disabled=true;
            try{
              const current=G.getMon(mon.uid);
              if(!current||+current.id!==+mega.base){P.UI?.toast?.('Pokémon không còn phù hợp để Mega Evolution.');return;}
              if((G.itemCount(mega.stone)||0)<=0){P.UI?.toast?.('Bạn chưa có '+mega.stoneName+'.');return;}
              const evolved=G.evolveMon(mon.uid,mega.id);
              if(!evolved){P.UI?.toast?.('Mega Evolution thất bại, đá không bị mất.');return;}
              G.addItem(mega.stone,-1);
              G.save();P.Sfx?.upgrade?.(2);P.UI?.toast?.(G.DEX[mega.id]?.name+' Mega Evolution thành công!');
              modal.querySelector('.dc-x')?.click();P.Screens?.team?.render?.();P.Screens?.adventure?.refreshTeam?.();P.App?.refreshHeader?.();
            }finally{btn.dataset.busy='0';}
          };
          grid.appendChild(btn);
        }
        const actions=modal.querySelector('.item-actions');
        (actions||modal.querySelector('.fam-sec'))?.insertAdjacentElement('beforebegin',panel);
      }

      function injectVitaminShop() {
        const P=window.PokeCatch,G=P?.Game,grid=document.querySelector('#screen-shop.active .sh-grid');
        if(!G||!grid)return;
        Object.entries(VITAMINS).forEach(function([id,info]){
          if(grid.querySelector('[data-id="'+id+'"]'))return;
          const card=document.createElement('div');card.className='sh-item vitamin-shop';card.dataset.id=id;
          card.innerHTML='<div class="sh-top"><div class="sh-ic"><img src="assets/items/'+id+'.png" alt=""></div><div class="sh-name"><h4>'+info.label+'</h4><small>Tăng EV '+info.statLabel+' cho một Pokémon.</small></div></div><div class="sh-bottom"><span class="sh-owned">Đang có: <b>'+(G.itemCount(id)||0)+'</b></span><button class="btn primary buy">'+info.price.toLocaleString()+' ₽</button></div>';
          card.querySelector('button').onclick=function(){if((G.S.money||0)<info.price){P.UI?.toast?.('Không đủ tiền!');return;}G.S.money-=info.price;G.addItem(id,1);G.save();P.Sfx?.buy?.();P.App?.refreshHeader?.();P.UI?.toast?.('Đã mua '+info.label);card.remove();injectVitaminShop();};
          grid.appendChild(card);
        });
      }

      // Mega Stones are Raid Boss rewards only. Adventures never inject Mega
      // encounters and ordinary wins cannot grant a stone.
      let megaById={};
      function installMegaRaids(P,list){
        const R=P?.Raids,G=P?.Game;
        if(!R?.swapEntry||R.__megaRaidInstalled||!G)return;
        const today=R.dateKey?.()||new Date().toISOString().slice(0,10);
        const regions=(R.regions?.()||[]).filter(r=>r?.dex);
        if(regions.length){
          const day=Math.max(0,R.dayOf?.(today)||0),region=regions[day%regions.length];
          const pool=list.filter(m=>m.base>=region.dex[0]&&m.base<=region.dex[1]);
          if(pool.length){
            const mega=pool[Math.floor(day/Math.max(1,regions.length))%pool.length];
            R.swapEntry(region.key,today,mega.id);
          }
        }
        const nativeResult=R.result.bind(R);
        R.result=function(run,event){
          const out=nativeResult(run,event),mega=megaById[run?.id];
          if(mega&&event?.type==='capture'){
            const rewards=G.S.megaRaidRewards||(G.S.megaRaidRewards={});
            const key=(run.date||today)+'|'+run.reg+'|'+mega.id;
            if(!rewards[key]){
              rewards[key]=1;G.addItem(mega.stone,1);G.save();
              P.UI?.toast?.('Mega Raid Boss '+mega.name+' rớt '+mega.stoneName+'!');
            }
          }
          return out;
        };
        Object.defineProperty(R,'__megaRaidInstalled',{value:true});
        R.emit?.();
      }
      fetch('/data/mega_stones.json').then(r=>r.json()).then(list=>{
        megaList=list;
        megaById=Object.fromEntries(list.map(m=>[m.id,m]));
        installMegaRaids(window.PokeCatch,list);
      }).catch(()=>{});

      const boot=setInterval(function(){
        const P=window.PokeCatch;
        if(!P?.Game?.S||!megaList.length)return;
        installMegaRaids(P,megaList);
        trackSelectedPokemon(P);
        patchStats(P);
        for(const [id,info] of Object.entries(VITAMINS)) P.ITEM_NAMES[id]=info.label;
        clearInterval(boot);
      },25);
      new MutationObserver(function(){const modal=document.querySelector('.dexcard.mon-card');if(modal){installVitaminPanel(modal);installMegaPanel(modal);}injectVitaminShop();}).observe(document.body,{childList:true,subtree:true});
      setInterval(injectVitaminShop,500);
    })();
  </script>
