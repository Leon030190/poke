<script>
window.addEventListener('DOMContentLoaded', function () {
  var megaLayoutScheduled = false;
  function placeMegaStoneIcons() {
    megaLayoutScheduled = false;
    document.querySelectorAll('.evo-chain:not([data-mega-layout-ready])').forEach(function (chain) {
      chain.setAttribute('data-mega-layout-ready', '1');
      chain.querySelectorAll('.arrow img[src*="-mega-stone"]').forEach(function (stone) {
      var arrow = stone.closest('.arrow');
      var megaPokemon = arrow && arrow.nextElementSibling;
      if (!megaPokemon || !megaPokemon.classList.contains('evo')) return;

      var src = stone.getAttribute('src') || '';
      var stoneKey = src.replace(/^.*\/|\.[^.]+$/g, '');
      var stoneName = window.PokeCatch?.ITEM_NAMES?.[stoneKey] || stone.alt || stone.title || 'Mega Stone';
      stoneName = stoneName.replace(/\s*\(Required\)/i, '');

      stone.classList.add('mega-stone-required');
      stone.title = stoneName + ' (Required)';
      stone.alt = stoneName;
      megaPokemon.classList.add('mega-evolution');
      megaPokemon.prepend(stone);
      arrow.classList.add('mega-stone-moved');
      });
    });
    document.querySelectorAll('.evo-chain .evo').forEach(function (pokemon) {
      var sprite = pokemon.querySelector('.sprbox img[data-id]');
      var id = +(sprite?.dataset.id || 0);
      var game = window.PokeCatch?.Game;
      var caught = !!(id && game?.S?.dex?.[id]);
      var physicallyOwned = false;
      if (id && game?.ownedMons) {
        try { physicallyOwned = game.ownedMons().some(function (mon) { return +mon.id === id; }); } catch (_) {}
      }
      var unlocked = pokemon.classList.contains('own') || pokemon.classList.contains('cur') || caught || physicallyOwned;
      pokemon.classList.toggle('unknown', !unlocked);
      var ownedBox = pokemon.querySelector('.sprbox');
      if (unlocked) {
        pokemon.classList.remove('unknown');
        pokemon.style.setProperty('filter', 'none', 'important');
        pokemon.style.setProperty('opacity', '1', 'important');
        if (ownedBox) {
          ownedBox.style.setProperty('filter', 'none', 'important');
          ownedBox.style.setProperty('opacity', '1', 'important');
          ownedBox.querySelectorAll('img,canvas').forEach(function (art) {
            art.style.setProperty('filter', 'none', 'important');
            art.style.setProperty('opacity', '1', 'important');
            art.style.setProperty('mix-blend-mode', 'normal', 'important');
          });
        }
        return;
      }
      if (ownedBox) {
        ownedBox.style.setProperty('filter', 'grayscale(1) brightness(.72)', 'important');
        ownedBox.style.setProperty('opacity', '.34', 'important');
      }
    });
  }

  function scheduleMegaLayout() {
    if (megaLayoutScheduled) return;
    megaLayoutScheduled = true;
    requestAnimationFrame(placeMegaStoneIcons);
  }
  scheduleMegaLayout();
  new MutationObserver(function () {
    scheduleMegaLayout();
  }).observe(document.body, { childList: true, subtree: true });
});
</script>
  <script>
    window.SW_REG = Promise.resolve();

    // Regional forms belong to the region where that form was introduced,
    // not the National Dex range of their base species. Keep Galar's three
    // birds as-is and place the existing Hisui/Paldea forms correctly.
    window.__dexRegionEntries = function (region, nativeEntries) {
      var targets = {
        5202:'galar',7701:'galar',7801:'galar',7901:'galar',8001:'galar',8301:'galar',
        14401:'galar',14501:'galar',14601:'galar',
        10001:'sinnoh',10101:'sinnoh',15701:'sinnoh',21101:'sinnoh',21501:'sinnoh',
        50301:'sinnoh',54901:'sinnoh',57001:'sinnoh',57101:'sinnoh',62801:'sinnoh',
        70501:'sinnoh',70601:'sinnoh',71301:'sinnoh',72401:'sinnoh',
        12801:'paldea',19401:'paldea'
      };
      var key = String(region?.key || '').toLowerCase();
      var list = (nativeEntries || []).filter(function (entry) { return !targets[entry.id]; });
      var dex = window.PokeCatch?.POKEDEX || [];
      Object.keys(targets).forEach(function (rawId) {
        if (targets[rawId] !== key) return;
        var id = +rawId;
        var entry = dex.find(function (pokemon) { return +pokemon.id === id; });
        if (entry && !list.some(function (pokemon) { return +pokemon.id === id; })) list.push(entry);
      });
      return list;
    };

    // Keep the game at a stable 1:1 viewport on touch devices. Safari can
    // still trigger page zoom from gestures even with the viewport directive,
    // so cancel those browser-only gestures without blocking normal controls.
    document.addEventListener('gesturestart', function (event) {
      event.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturechange', function (event) {
      event.preventDefault();
    }, { passive: false });
    document.addEventListener('gestureend', function (event) {
      event.preventDefault();
    }, { passive: false });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function (error) {
          console.warn('PWA service worker:', error);
        });
      });
    }
    window.BOOT_FAIL = function () {
      if (document.getElementById('boot-fail')) return;
      var box = document.createElement('div'), p = document.createElement('p'), b = document.createElement('button');
      box.id = 'boot-fail'; p.textContent = 'Game load failed in offline mode.'; b.textContent = 'Retry';
      b.onclick = function () { location.reload(); };
      box.appendChild(p); box.appendChild(b);
      (document.body || document.documentElement).appendChild(box);
    };
    window.addEventListener('error', function (event) {
      if (event && event.target && event.target !== window) return;
      var log = document.getElementById('runtime-error-log');
      if (!log) {
        log = document.createElement('pre');

  <script>
    // Safe Evo All: preview, reserve items, revalidate, and evolve one stage.
    (function () {
      var evoAllBusy = false;
      function esc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
        });
      }

      function monName(Game, id) { return Game.DEX?.[id]?.name || ('No. ' + id); }
      function itemName(P, key) { return P.ITEM_NAMES?.[key] || key.replace(/-/g, ' '); }
      function monImage(mon) { return 'assets/pokemon/' + (mon.shiny ? 'shiny/' : '') + mon.id + '.png'; }

      function ownedForEvo(Game) {
        var mons = typeof Game.sideMons === 'function' ? Game.sideMons() : (Game.S?.mons || []);
        var seen = new Set();
        return mons.filter(function (mon) {
          return mon?.uid && !seen.has(mon.uid) && seen.add(mon.uid);
        });
      }

      function inspectAll() {
        var P = window.PokeCatch, Game = P?.Game;
        if (!Game) return {ready:[], blocked:[]};
        var ready = [], blocked = [], available = Object.assign({}, Game.S?.items || {});

        ownedForEvo(Game).forEach(function (mon) {
          var raw = (P.EVOLUTIONS?.[mon.id] || []).filter(function (rule) { return rule && rule.to; });
          if (!raw.length) return;

          var normalRaw = raw.filter(function (rule) { return !rule.mega && !P.MEGA?.isMega?.(rule.to); });
          if (!normalRaw.length) {
            blocked.push({mon:mon, reason:'Mega Evolution không chạy bằng Evo All'});
            return;
          }

          var level = (Game.levelEvolutions?.(mon) || []).filter(function (rule) { return !rule.mega && !P.MEGA?.isMega?.(rule.to); });
          var items = (Game.itemEvolutions?.(mon) || []).filter(function (rule) { return !rule.mega && !P.MEGA?.isMega?.(rule.to); });
          var eligible = level.concat(items).filter(function (rule, index, list) {
            return list.findIndex(function (other) { return other.to === rule.to && other.item === rule.item; }) === index;
          });

          if (eligible.length > 1) {
            blocked.push({mon:mon, reason:'Có nhiều nhánh tiến hóa — cần chọn thủ công'});
            return;
          }
          if (!eligible.length) {
            var levels = normalRaw.filter(function (rule) { return rule.level; });
            var needed = levels.length ? Math.min.apply(Math, levels.map(function (rule) { return rule.level; })) : null;
            var reason = needed && mon.level < needed
              ? 'Cần đạt Lv.' + needed
              : 'Chưa đủ điều kiện thời gian, đội hình, form hoặc vật phẩm';
            var itemRule = normalRaw.find(function (rule) { return rule.item; });
            if (itemRule && !(Game.itemCount?.(itemRule.item) > 0)) reason = 'Thiếu ' + itemName(P, itemRule.item);
            blocked.push({mon:mon, reason:reason});
            return;
          }

          var rule = eligible[0];
          if (rule.item) {
            var count = available[rule.item] == null ? (Game.itemCount?.(rule.item) || 0) : available[rule.item];
            if (count <= 0) {
              blocked.push({mon:mon, reason:'Thiếu ' + itemName(P, rule.item)});
              return;
            }
            available[rule.item] = count - 1;
          }
          ready.push({mon:mon, uid:mon.uid, from:mon.id, to:rule.to, item:rule.item || null});
        });
        return {ready:ready, blocked:blocked};
      }

      function revalidate(entry, reserved) {
        var P = window.PokeCatch, Game = P?.Game, mon = Game?.getMon?.(entry.uid);
        if (!mon || mon.id !== entry.from) return {ok:false, reason:'Pokémon đã thay đổi'};
        var rules = (Game.levelEvolutions?.(mon) || []).concat(Game.itemEvolutions?.(mon) || []).filter(function (rule) {
          return rule.to === entry.to && (rule.item || null) === entry.item && !rule.mega && !P.MEGA?.isMega?.(rule.to);
        });
        if (rules.length !== 1) return {ok:false, reason:'Điều kiện không còn hợp lệ'};
        if (entry.item) {
          var needed = (reserved[entry.item] || 0) + 1;
          if ((Game.itemCount?.(entry.item) || 0) < needed) return {ok:false, reason:'Không đủ ' + itemName(P, entry.item)};
          if (typeof Game.addItem !== 'function') return {ok:false, reason:'Không thể trừ vật phẩm an toàn'};
          reserved[entry.item] = needed;
        }
        return {ok:true, mon:mon};
      }

      function syncAfterEvolution() {
        var P = window.PokeCatch;
        P.Screens?.team?.render?.();
        P.Screens?.adventure?.refreshTeam?.();
        P.App?.refreshHeader?.();
      }

      function showPreview() {
        if (evoAllBusy) return;
        evoAllBusy = true;
        document.querySelector('.evo-all-safe-modal')?.remove();
        var P = window.PokeCatch, Game = P?.Game, scan = inspectAll();
        var modal = document.createElement('div');
        modal.className = 'evo-all-safe-modal';
        var readyRows = scan.ready.map(function (entry, index) {
          var mon = entry.mon;
          return '<label class="evo-all-safe-row"><input type="checkbox" data-evo-index="' + index + '" checked>' +
            '<img src="' + esc(monImage(mon)) + '" alt=""><span><b>' + esc(monName(Game, entry.from)) + ' Lv.' + mon.level + ' → ' + esc(monName(Game, entry.to)) + '</b><small>' +
            (entry.item ? 'Dùng 1 ' + esc(itemName(P, entry.item)) : 'Đủ điều kiện level') + (mon.shiny ? ' · ✨ Shiny' : '') + '</small></span></label>';
        }).join('');
        var blockedRows = scan.blocked.slice(0, 12).map(function (entry) {
          return '<div class="evo-all-safe-row blocked"><span>—</span><img src="' + esc(monImage(entry.mon)) + '" alt=""><span><b>' + esc(monName(Game, entry.mon.id)) + ' Lv.' + entry.mon.level + '</b><small>' + esc(entry.reason) + '</small></span></div>';
        }).join('') + (scan.blocked.length > 12 ? '<p class="evo-all-safe-summary">… và ' + (scan.blocked.length - 12) + ' Pokémon khác chưa đủ điều kiện.</p>' : '');
        modal.innerHTML = '<section class="evo-all-safe-panel" role="dialog" aria-modal="true" aria-label="Evo All">' +
          '<header class="evo-all-safe-head"><h3>Evo All · Kiểm tra trước</h3><button class="evo-all-safe-close" aria-label="Đóng">×</button></header>' +
          '<div class="evo-all-safe-body"><p class="evo-all-safe-summary"><b>' + scan.ready.length + '</b> Pokémon sẵn sàng · <b>' + scan.blocked.length + '</b> Pokémon chưa đủ điều kiện. Mỗi Pokémon chỉ tiến hóa một cấp.</p>' +
          '<div class="evo-all-safe-list">' + (readyRows || '<p>Không có Pokémon nào đủ điều kiện tiến hóa.</p>') + blockedRows + '</div></div>' +
          '<footer class="evo-all-safe-actions"><button class="btn evo-all-cancel">Hủy</button><button class="btn gold evo-all-confirm"' + (scan.ready.length ? '' : ' disabled') + '>Tiến hóa đã chọn</button></footer></section>';
        document.body.appendChild(modal);

        var close = function () { modal.remove(); evoAllBusy = false; };
        modal.querySelector('.evo-all-safe-close').onclick = close;
        modal.querySelector('.evo-all-cancel').onclick = close;
        modal.addEventListener('click', function (event) { if (event.target === modal) close(); });
        modal.querySelector('.evo-all-confirm').onclick = function () {
          var confirmButton = this;
          if (confirmButton.disabled) return;
          confirmButton.disabled = true;
          var selected = Array.from(modal.querySelectorAll('[data-evo-index]:checked')).map(function (box) { return scan.ready[+box.dataset.evoIndex]; });
          if (!selected.length) { confirmButton.disabled = false; P.UI?.toast?.('Chưa chọn Pokémon nào.'); return; }
          var reserved = {}, valid = [], failed = [];
          selected.forEach(function (entry) {
            var check = revalidate(entry, reserved);
            if (check.ok) valid.push(entry); else failed.push(monName(Game, entry.from) + ': ' + check.reason);
          });
          var evolved = 0;
          Game.holdSave?.(true);
          try {
            valid.forEach(function (entry) {
              var before = Game.getMon(entry.uid);
              if (!before || before.id !== entry.from) return;
              var result = Game.evolveMon(entry.uid, entry.to);
              if (!result) { failed.push(monName(Game, entry.from) + ': tiến hóa thất bại'); return; }
              if (entry.item) Game.addItem?.(entry.item, -1);
              evolved++;
            });
          } finally {
            Game.holdSave?.(false);
            Game.save?.();
          }
          close();
          requestAnimationFrame(syncAfterEvolution);
          P.Sfx?.upgrade?.(2);
          P.UI?.toast?.('✓ Đã tiến hóa ' + evolved + ' Pokémon' + (failed.length ? ' · ' + failed.length + ' không thể thực hiện' : ''));
          if (failed.length) console.warn('Evo All skipped:', failed);
        };
      }

      document.addEventListener('click', function (event) {
        var button = event.target.closest('#pc-evo-all');
        if (!button) return;
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
        showPreview();
      }, true);

      // The original renderer hides its button whenever its old level-only
      // counter reaches zero. Keep Evo All visible: our preview explains why
      // every Pokémon is ready or blocked, including item evolutions.
      function keepEvoAllVisible() {
        var button = document.getElementById('pc-evo-all');
        if (!button) return;
        button.hidden = false;
        button.removeAttribute('hidden');
        button.title = 'Kiểm tra và tiến hóa an toàn tất cả Pokémon đủ điều kiện';
        var full = button.querySelector('.full');
        if (full) full.textContent = 'Evo All';
      }
      window.addEventListener('load', function () {
        keepEvoAllVisible();
        var queued = false;
        new MutationObserver(function () {
          if (queued) return;
          queued = true;
          requestAnimationFrame(function () { queued = false; keepEvoAllVisible(); });
        }).observe(document.getElementById('screen-team') || document.body, {childList:true, subtree:true});
      });
    })();
  </script>

  <script>
    // Team/PC EXP controls: safely use one candy on one Pokémon or one candy
    // per eligible Pokémon. The game's own useItem API performs the level-cap,
    // inventory and evolution checks before consuming anything.
    (function () {
      var selectedUid = null;
      var candies = [
        {id:'exp-candy-s', label:'EXP Candy S'},
        {id:'exp-candy-m', label:'EXP Candy M'},
        {id:'exp-candy-xl', label:'EXP Candy XL'},
        {id:'exp-candy-big', label:'EXP Candy Big'},
        {id:'rare-candy', label:'Rare Candy'}
      ];

      function esc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
        });
      }
      function nameOf(Game, mon) { return Game.DEX?.[mon.id]?.name || ('No. ' + mon.id); }
      function itemLabel(P, item) { return P.ITEM_NAMES?.[item.id] || item.label; }
      function itemImage(item) { return 'assets/items/' + item.id + '.png'; }
      function uniqueMons(Game) {
        var seen = new Set();
        var mons = typeof Game.allMons === 'function' ? Game.allMons() : (Game.S?.mons || []);
        return mons.filter(function (mon) { return mon?.uid && !seen.has(mon.uid) && seen.add(mon.uid); });
      }
      function canReceive(Game, mon) {
        if (!mon || mon.level >= 100) return false;
        try { return typeof Game.capped === 'function' ? !Game.capped(mon) : mon.level < (Game.levelCap?.(mon) || 100); }
        catch (_) { return mon.level < 100; }
      }
      function sync(saveNeeded) {
        var P = window.PokeCatch;
        if (saveNeeded) P.Game?.save?.();
        // One refresh is enough: the app renders the active screen and syncs
        // the Adventure team itself. The old five-render chain caused freezes.
        P.App?.refresh?.();
      }
      function useOne(uid, itemId, modal) {
        var P = window.PokeCatch, Game = P?.Game, mon = Game?.getMon?.(uid);
        if (!mon) { P?.UI?.toast?.('Không tìm thấy Pokémon đã chọn.'); return; }
        if (!canReceive(Game, mon)) { P.UI?.toast?.(nameOf(Game, mon) + ' đã đạt giới hạn level hiện tại.'); return; }
        if ((Game.itemCount?.(itemId) || 0) <= 0) { P.UI?.toast?.('Không còn ' + itemLabel(P, {id:itemId,label:itemId})); return; }
        var before = mon.level;
        var result = Game.useItem?.(uid, itemId);
        if (!result) { P.UI?.toast?.('Không thể dùng vật phẩm cho Pokémon này.'); return; }
        sync(false);
        modal?.remove();
        P.Sfx?.upgrade?.(Math.max(1, result.levels || 1));
        P.UI?.toast?.('✓ ' + nameOf(Game, mon) + ': Lv.' + before + ' → Lv.' + mon.level + (result.levels ? '' : ' · đã nhận EXP'));
      }
      function useAll(itemId, modal) {
        var P = window.PokeCatch, Game = P?.Game;
        if (!Game) return;
        var available = Game.itemCount?.(itemId) || 0;
        var eligible = uniqueMons(Game).filter(function (mon) { return canReceive(Game, mon); }).sort(function (a, b) {
          return a.level - b.level || (a.xp || 0) - (b.xp || 0) || String(a.uid).localeCompare(String(b.uid));
        });
        var count = Math.min(available, eligible.length);
        if (!count) {
          P.UI?.toast?.(available ? 'Tất cả Pokémon đã đạt giới hạn level hiện tại.' : 'Không còn vật phẩm EXP này.');
          return;
        }
        var label = itemLabel(P, {id:itemId,label:itemId});
        if (!window.confirm('Dùng ' + count + ' ' + label + ' cho ' + count + ' Pokémon?\nMỗi Pokémon dùng 1 viên; ưu tiên Pokémon level thấp.')) return;
        // Batch directly through the game's level APIs, then subtract the
        // total once and save once. Calling useItem N times serialized the
        // complete save N times and was the main EXP All freeze on large PCs.
        var used = 0, levels = 0, evolveReady = 0;
        var candyXp = itemId === 'rare-candy' ? 0 : (Game.expCandyXp?.(itemId) || 0);
        for (var i = 0; i < count; i++) {
          var mon = Game.getMon?.(eligible[i].uid);
          if (!canReceive(Game, mon)) continue;
          var result = itemId === 'rare-candy' ? Game.levelUp?.(mon) : Game.gainXp?.(mon, candyXp);
          if (!result) continue;
          used++;
          levels += result.levels || 0;
          if (result.evolve) evolveReady++;
        }
        if (used) Game.addItem?.(itemId, -used);
        sync(true);
        modal?.remove();
        P.Sfx?.upgrade?.(2);
        P.UI?.toast?.('✓ EXP All: ' + used + ' Pokémon · +' + levels + ' level' + (evolveReady ? ' · ' + evolveReady + ' có thể tiến hóa' : ''));
      }
      function showPicker(scope, uid) {
        document.querySelector('.exp-use-modal')?.remove();
        var P = window.PokeCatch, Game = P?.Game;
        if (!Game) return;
        var mon = scope === 'one' ? Game.getMon?.(uid) : null;
        if (scope === 'one' && !mon) { P.UI?.toast?.('Hãy chọn lại Pokémon trong Team/PC.'); return; }
        var eligibleCount = uniqueMons(Game).filter(function (entry) { return canReceive(Game, entry); }).length;
        var rows = candies.map(function (item) {
          var count = Game.itemCount?.(item.id) || 0;
          var xp = item.id === 'rare-candy' ? 'Tăng đúng 1 level' : '+' + (Game.expCandyXp?.(item.id) || P.CONFIG?.EXP_CANDIES?.[item.id]?.xp || 0).toLocaleString() + ' EXP';
          var action = scope === 'one' ? 'Dùng 1' : 'Dùng cho tất cả';
          return '<div class="exp-use-row' + (count ? '' : ' empty') + '"><img src="' + esc(itemImage(item)) + '" alt=""><span><b>' + esc(itemLabel(P, item)) + ' ×' + count + '</b><small>' + esc(xp) + '</small></span><button class="btn small gold" data-exp-item="' + esc(item.id) + '"' + (count ? '' : ' disabled') + '>' + action + '</button></div>';
        }).join('');
        var modal = document.createElement('div');
        modal.className = 'exp-use-modal';
        modal.innerHTML = '<section class="exp-use-panel" role="dialog" aria-modal="true" aria-label="Dùng EXP"><header class="exp-use-head"><h3>' +
          (scope === 'one' ? 'Dùng EXP · ' + esc(nameOf(Game, mon)) + ' Lv.' + mon.level : 'EXP All · ' + eligibleCount + ' Pokémon hợp lệ') +
          '</h3><button class="exp-use-close" aria-label="Đóng">×</button></header><div class="exp-use-body"><p class="exp-use-note">' +
          (scope === 'one' ? 'Chọn một vật phẩm. Game chỉ trừ item sau khi kiểm tra level và điều kiện.' : 'Mỗi Pokémon dùng 1 viên. Nếu không đủ item, hệ thống ưu tiên Pokémon level thấp; Pokémon đã chạm giới hạn không bị trừ item.') +
          '</p><div class="exp-use-list">' + rows + '</div></div></section>';
        document.body.appendChild(modal);
        var close = function () { modal.remove(); };
        modal.querySelector('.exp-use-close').onclick = close;
        modal.addEventListener('click', function (event) {
          if (event.target === modal) { close(); return; }
          var button = event.target.closest('[data-exp-item]');
          if (!button) return;
          if (button.disabled || modal.dataset.busy === '1') return;
          modal.dataset.busy = '1';
          modal.querySelectorAll('button').forEach(function (entry) { entry.disabled = true; });
          if (scope === 'one') useOne(uid, button.dataset.expItem, modal);
          else useAll(button.dataset.expItem, modal);
          if (modal.isConnected) {
            modal.dataset.busy = '';
            modal.querySelectorAll('button').forEach(function (entry) {
              entry.disabled = entry.dataset.expItem ? (Game.itemCount?.(entry.dataset.expItem) || 0) <= 0 : false;
            });
          }
        });

      document.addEventListener('pointerdown', function (event) {
        var cell = event.target.closest('#pc-grid [data-uid], #team-slots [data-uid], #screen-team [data-uid]');
        if (cell?.dataset?.uid) selectedUid = cell.dataset.uid;
      }, true);

      document.addEventListener('click', function (event) {
        var all = event.target.closest('#pc-exp-all');
        if (all) {
          event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation();
          showPicker('all');
          return;
        }
        var one = event.target.closest('.mon-exp-action-btn');
        if (one) { event.preventDefault(); showPicker('one', one.dataset.uid || selectedUid); }
      }, true);

      function injectControls() {
        var evo = document.getElementById('pc-evo-all');
        if (evo && !document.getElementById('pc-exp-all')) {
          var all = document.createElement('button');
          all.id = 'pc-exp-all';
          all.className = 'btn small';
          all.type = 'button';
          all.title = 'Dùng vật phẩm EXP cho tất cả Pokémon hợp lệ';
          all.textContent = 'EXP All';
          evo.insertAdjacentElement('afterend', all);
        }
        var modal = document.querySelector('.dexcard.mon-card');
        var sum = modal?.querySelector('.dc-sum');
        if (sum && !modal.querySelector('.mon-exp-action-btn') && selectedUid) {
          var Game = window.PokeCatch?.Game, mon = Game?.getMon?.(selectedUid);
          if (mon) {
            var one = document.createElement('button');
            one.type = 'button';
            one.className = 'btn small mon-exp-action-btn';
            one.dataset.uid = selectedUid;
            one.textContent = 'Dùng EXP';
            one.title = 'Dùng EXP Candy hoặc Rare Candy cho Pokémon này';
            sum.prepend(one);
          }
        }
      }
      window.addEventListener('load', function () {
        var scheduled = false;
        function scheduleInject() {
          if (scheduled) return;
          scheduled = true;
          requestAnimationFrame(function () { scheduled = false; injectControls(); });
        }
        scheduleInject();
        new MutationObserver(scheduleInject).observe(document.body, {childList:true, subtree:true});
      });
    })();

  <script>
    // Pokédex region tabs. The original UI renders every region as a vertical
    // accordion; keep only the chosen region mounted visually and expose all
    // region names in one horizontally scrollable row above the list.
    window.addEventListener('DOMContentLoaded', function () {
      var storageKey = 'pokecatch.dex.selectedRegion';
      var scheduled = false;
      var regionalFormTargets = {
        '5202':'galar','7701':'galar','7801':'galar','7901':'galar','8001':'galar','8301':'galar',
        '14401':'galar','14501':'galar','14601':'galar',
        '10001':'sinnoh','10101':'sinnoh','15701':'sinnoh','21101':'sinnoh','21501':'sinnoh',
        '50301':'sinnoh','54901':'sinnoh','57001':'sinnoh','57101':'sinnoh','62801':'sinnoh',
        '70501':'sinnoh','70601':'sinnoh','71301':'sinnoh','72401':'sinnoh',
        '12801':'paldea','19401':'paldea'
      };
      var regionalFormSources = {
        '5202':'kanto','7701':'kanto','7801':'kanto','7901':'kanto','8001':'kanto','8301':'kanto',
        '14401':'kanto','14501':'kanto','14601':'kanto','10001':'kanto','10101':'kanto','12801':'kanto',
        '15701':'johto','19401':'johto','21101':'johto','21501':'johto',
        '50301':'unys','54901':'unys','57001':'unys','57101':'unys','62801':'unys',
        '70501':'kalos','70601':'kalos','71301':'kalos','72401':'kalos'
      };
      var regionalFormTemplates = new Map();

      function syncDexRegionTabs() {
        scheduled = false;
        var root = document.getElementById('dex-regions');
        if (!root) return;
        var regions = Array.from(root.children).filter(function (node) {
          return node.classList && node.classList.contains('dex-region');
        });
        if (!regions.length) return;

        var names = regions.map(function (region, index) {
          var title = region.querySelector('.dex-region-head h3');
          return title && title.textContent.trim() || ('Region ' + (index + 1));
        });
        var signature = names.join('|');
        var nav = root.previousElementSibling;
        if (!nav || !nav.classList.contains('dex-region-tabs')) {
          nav = document.createElement('nav');
          nav.className = 'dex-region-tabs';
          nav.setAttribute('aria-label', 'Pokédex regions');
          root.parentNode.insertBefore(nav, root);
        }

        var selected = '';
        try { selected = localStorage.getItem(storageKey) || ''; } catch (_) {}
        var requestedRegion = new URLSearchParams(location.search).get('dexRegion');
        if (requestedRegion) {
          var requestedIndex = regions.findIndex(function (region) {
            return String(region.dataset.region || '').toLowerCase() === requestedRegion.toLowerCase();
          });
          if (requestedIndex >= 0) selected = names[requestedIndex];
        }
        if (!names.includes(selected)) selected = names[0];

        function removeExactDuplicateCards(region) {
          if (!region || !/^(kanto|hoenn)$/i.test(region.dataset.region || '')) return;
          var seenIds = new Set();
          var seenRendered = new Set();
          region.querySelectorAll('.dex-cell').forEach(function (cell) {
            var id = cell.dataset.id || '';
            if (/^kanto$/i.test(region.dataset.region || '') && cell.classList.contains('dex-form')) {
              var mega = window.PokeCatch?.MEGA?.isMega?.(+id);
              if (!mega) {
                // Kanto's tab contains only its original species; Alola,
                // Galar, Hisui and other regional variants belong elsewhere.
                cell.remove();
                return;
              }
              // Mega forms exist but enter the Pokédex only after the matching
              // stone has actually been used on the original Pokémon.
              cell.classList.toggle('mega-locked', !window.PokeCatch?.Game?.S?.dex?.[id]);
            }
            var name = cell.querySelector('.nm')?.textContent.trim() || '';
            var number = cell.querySelector('.num')?.textContent.trim() || '';
            var image = cell.querySelector('.sprbox img')?.getAttribute('src') || '';
            var renderedKey = name && number ? [name, number, image].join('|') : '';
            if ((id && seenIds.has(id)) || (renderedKey && seenRendered.has(renderedKey))) {
              cell.remove();
              return;
            }
            if (id) seenIds.add(id);
            if (renderedKey) seenRendered.add(renderedKey);
          });
        }

        function captureRegionalForms(region) {
          var sourceKey = String(region?.dataset?.region || '').toLowerCase();
          region?.querySelectorAll('.dex-cell').forEach(function (cell) {
            var id = cell.dataset.id || '';
            var targetKey = regionalFormTargets[id];
            if (!targetKey || targetKey === sourceKey) return;
            cell.querySelectorAll('canvas').forEach(function (canvas) {
              try { canvas._pokePlayer?.destroy?.(); } catch (_) {}
              canvas.remove();
            });
            cell.classList.remove('canvas-ready', 'dex-animation-watched', 'dex-animation-pending', 'mega-locked');
            cell.querySelector('.sprbox img')?.style.removeProperty('display');
            if (!regionalFormTemplates.has(id)) regionalFormTemplates.set(id, cell);
            cell.remove();
          });
        }

        function ensureRegionalForms(targetKey) {
          // Entries are built directly in their destination region below.
          // Avoid mounting several source Pokédex grids just to move one card.
        }

        function installRegionalForms(region) {
          var key = String(region?.dataset?.region || '').toLowerCase();
          var grid = region?.querySelector('.dex-grid, .dex-list, [data-dex-grid]');
          if (!key || !grid) return;
          Object.keys(regionalFormTargets).forEach(function (id) {
            if (regionalFormTargets[id] !== key || region.querySelector('.dex-cell[data-id="' + id + '"]')) return;
            var cell = regionalFormTemplates.get(id);
            if (!cell) {
              var pokemon = window.PokeCatch?.Game?.DEX?.[+id] || window.PokeCatch?.POKEDEX?.find(function (entry) { return +entry.id === +id; });
              var sprBox = window.PokeCatch?.UI?.sprBox;
              if (!pokemon || typeof sprBox !== 'function') return;
              cell = document.createElement('div');
              cell.className = 'dex-cell dex-form';
              cell.dataset.id = id;
              var dexNo = window.PokeCatch?.UI?.dexNo?.(+id) || id;
              cell.innerHTML = '<span class="cnt"></span><span class="new">NEW</span>' +
                sprBox(+id, false, 2, 96).replace('<img ', '<img loading="lazy" ') +
                '<div class="num">No. ' + dexNo + '</div><div class="nm"></div>';
              var caught = !!window.PokeCatch?.Game?.S?.dex?.[id];
              var seen = caught || !!window.PokeCatch?.Game?.S?.seen?.[id];
              cell.classList.toggle('unknown', !seen);
              cell.classList.toggle('caught', caught);
              cell.querySelector('.nm').textContent = seen ? pokemon.name : '???';
              cell.onclick = function () { window.PokeCatch?.UI?.showDexCard?.(+id, { full: true }); };
              regionalFormTemplates.set(id, cell);
            }
            cell.classList.remove('canvas-ready', 'dex-animation-watched', 'dex-animation-pending', 'mega-locked');
            cell.querySelectorAll('canvas').forEach(function (canvas) { canvas.remove(); });
            cell.querySelector('.sprbox img')?.style.removeProperty('display');
            grid.appendChild(cell);
          });
        }

        function stopAndParkRegion(region) {
          if (!region) return;
          // Stop every canvas player from the region being left. Merely using
          // display:none kept decoded sheets and animation objects alive.
          region.querySelectorAll('canvas').forEach(function (canvas) {
            try { canvas._pokePlayer?.destroy?.(); } catch (_) {}
            canvas.parentElement?.querySelector('img')?.style.removeProperty('display');
            canvas.remove();
          });
          region.querySelectorAll('.dex-cell').forEach(function (cell) {
            cell.classList.remove('canvas-ready', 'dex-animation-watched');
          });

          // Detach the Pokémon cards from the inactive region. Keep them in a
          // fragment so returning to the tab is fast and lossless.
          var grid = region.querySelector('.dex-grid, .dex-list, [data-dex-grid]');
          if (!grid) return;
          var cells = Array.from(grid.children).filter(function (node) {
            return node.classList?.contains('dex-cell');
          });
          if (!cells.length) return;
          var parked = region.__dexPark || document.createDocumentFragment();
          cells.forEach(function (cell) { parked.appendChild(cell); });
          region.__dexPark = parked;
          region.dataset.dexParked = 'true';
        }

        function restoreRegion(region) {
          if (!region) return;
          var grid = region.querySelector('.dex-grid, .dex-list, [data-dex-grid]');
          if (grid && region.__dexPark?.childNodes?.length) grid.appendChild(region.__dexPark);
          region.dataset.dexParked = 'false';
        }

        function selectRegion(name, shouldFocus) {
          selected = names.includes(name) ? name : names[0];
          try { localStorage.setItem(storageKey, selected); } catch (_) {}
          var selectedRegion = regions[names.indexOf(selected)];
          var selectedKey = String(selectedRegion?.dataset?.region || '').toLowerCase();
          if (['galar','sinnoh','paldea'].includes(selectedKey)) ensureRegionalForms(selectedKey);
          regions.forEach(function (region, index) {
            var active = names[index] === selected;
            captureRegionalForms(region);
            removeExactDuplicateCards(region);
            if (active) {
              restoreRegion(region);
              window.__dexSelectedRegionKey = (region.dataset.region || '').toLowerCase();
              try { localStorage.setItem('pokecatch.dex.selectedRegionKey', window.__dexSelectedRegionKey); } catch (_) {}
              if (typeof region.__loadDex === 'function') region.__loadDex();
              captureRegionalForms(region);
              removeExactDuplicateCards(region);
              installRegionalForms(region);
            } else {
              stopAndParkRegion(region);
            }
            region.hidden = !active;
            region.classList.toggle('folded', false);
            region.setAttribute('aria-hidden', active ? 'false' : 'true');
            if (!active) removeExactDuplicateCards(region);
          });
          Array.from(nav.children).forEach(function (button) {
            var active = button.dataset.regionName === selected;
            button.classList.toggle('active', active);
            button.setAttribute('aria-selected', active ? 'true' : 'false');
            button.tabIndex = active ? 0 : -1;
            if (active && shouldFocus) {
              button.focus({ preventScroll: true });
              button.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
          });
          root.classList.add('dex-tabs-ready');
          // Names are filled by the original Pokédex renderer just after the
          // cards are built, so make one second exact-content pass as well.
          requestAnimationFrame(function () {
            regions.forEach(removeExactDuplicateCards);
          });
        }

        if (nav.dataset.signature !== signature) {
          nav.dataset.signature = signature;
          nav.replaceChildren();
          var genMap = {
            'kanto': 'Gen 1 · Kanto',
            'johto': 'Gen 2 · Johto',
            'hoenn': 'Gen 3 · Hoenn',
            'sinnoh': 'Gen 4 · Sinnoh',
            'unova': 'Gen 5 · Unova',
            'unys': 'Gen 5 · Unova',
            'kalos': 'Gen 6 · Kalos',
            'alola': 'Gen 7 · Alola',
            'galar': 'Gen 8 · Galar',
            'paldea': 'Gen 9 · Paldea'
          };
          names.forEach(function (name, index) {
            var regKey = (regions[index].dataset.region || '').toLowerCase();
            var label = genMap[regKey] || name;
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'dex-region-tab';
            button.dataset.regionName = name;
            button.textContent = label;
            button.setAttribute('role', 'tab');
            button.setAttribute('aria-controls', 'dex-region-tabpanel-' + index);
            regions[index].id = 'dex-region-tabpanel-' + index;
            button.onclick = function () {
              selectRegion(name, true);
            };
            nav.appendChild(button);
          });
        }
        selectRegion(selected, false);
      }

      function scheduleSync() {
        if (scheduled) return;
        scheduled = true;
        // Apply visibility before the sprite observer handles newly-rendered
        // cells, so hidden regions never start unnecessary animations.
        syncDexRegionTabs();
      }

      new MutationObserver(scheduleSync).observe(document.body, {
        childList: true,
        subtree: true
      });
      scheduleSync();
    });
  </script>

            var selected=file.files?.[0]; if(!selected)return; if(selected.size>25*1024*1024)throw new Error('File quá lớn');
            var parsed=JSON.parse(await selected.text()), state=parsed?.state || parsed;
            if(!validSaveState(state))throw new Error('Không đúng định dạng save PokeCatch');
            state.updatedAt=Date.now(); state.lastTick=Date.now();
            var key=saveKey(), old=localStorage.getItem(key); if(old)localStorage.setItem('pokecatch-save-before-import',old);
            localStorage.setItem(key,JSON.stringify(state)); localStorage.removeItem('pokecatch-tab'); status.textContent='Đã load save của '+String(state.trainer?.name||parsed?.playerName||'Trainer')+', đang mở lại game…'; window.PokeCatch?.Sfx?.buy?.(); setTimeout(function(){location.reload()},450);
          } catch(err) { status.textContent='Load thất bại: '+err.message; status.classList.add('error'); }
        };
        return panel;
      }

      function initHandlers() {
        if (window.PokeCatch?.I18n) {
          window.PokeCatch.I18n.lang = 'en';
        }

        var missingGalarForms = [
          {id:5202,base:52,name:'Galarian Meowth',slug:'meowth-galar',types:['steel'],stats:{hp:50,atk:65,def:55,spa:40,spd:40,spe:40}},
          {id:7701,base:77,name:'Galarian Ponyta',slug:'ponyta-galar',types:['psychic'],stats:{hp:50,atk:85,def:55,spa:65,spd:65,spe:90}},
          {id:7801,base:78,name:'Galarian Rapidash',slug:'rapidash-galar',types:['psychic','fairy'],stats:{hp:65,atk:100,def:70,spa:80,spd:80,spe:105}},
          {id:7901,base:79,name:'Galarian Slowpoke',slug:'slowpoke-galar',types:['psychic'],stats:{hp:90,atk:65,def:65,spa:40,spd:40,spe:15}},
          {id:8001,base:80,name:'Galarian Slowbro',slug:'slowbro-galar',types:['poison','psychic'],stats:{hp:95,atk:100,def:95,spa:100,spd:70,spe:30}},
          {id:8301,base:83,name:"Galarian Farfetch'd",slug:'farfetchd-galar',types:['fighting'],stats:{hp:52,atk:95,def:55,spa:58,spd:62,spe:55}}
        ];
        var gameDex = window.PokeCatch?.Game?.DEX;
        var pokedex = window.PokeCatch?.POKEDEX;
        var formList = window.PokeCatch?.FORMS?.LIST;
        if (gameDex && Array.isArray(pokedex) && Array.isArray(formList)) {
          missingGalarForms.forEach(function (form) {
            if (!gameDex[form.id] && gameDex[form.base]) {
              var entry = Object.assign({}, gameDex[form.base], {
                id: form.id, num: form.base, name: form.name, key: form.slug,
                form: 'Galar', isForm: true, types: form.types, stats: form.stats
              });
              gameDex[form.id] = entry;
              pokedex.push(entry);
            }
            if (!formList.some(function (item) { return +item.id === form.id; })) {
              formList.push({id:form.id,base:form.base,slug:form.slug,form:'Galar',types:form.types,stats:form.stats,single:true});
            }
          });
        }

        if (window.PokeCatch?.FORMS?.LIST) {
          var dex = window.PokeCatch.Game?.DEX || {};
          window.PokeCatch.FORMS.LIST = window.PokeCatch.FORMS.LIST.filter(function (f) {
            return !/mega|méga/i.test(String(f.form || f.slug || '')) || !!dex[f.id];
          });
        }

        if (window.PokeCatch?.MEGA?.LIST) {
          for (var i = 0; i < window.PokeCatch.MEGA.LIST.length; i++) {
            var md = window.PokeCatch.MEGA.LIST[i];
            if (window.PokeCatch.ITEM_NAMES && md.stone && md.stoneName) {
              window.PokeCatch.ITEM_NAMES[md.stone] = md.stoneName;
            }
            var mon = window.PokeCatch.Game?.DEX?.[md.id] || window.PokeCatch.POKEDEX?.find(function (p) { return p.id === md.id; });
            if (mon) {
              if (md.types) mon.types = md.types;
              mon.name = md.name;
              mon.form = md.form;
            }
          }
        }

        var saveBtn = document.getElementById('save-btn');
        if (saveBtn && !saveBtn.__localBound) {
          saveBtn.__localBound = true;
          saveBtn.addEventListener('click', function (e) {
            e.stopImmediatePropagation();
            e.preventDefault();
            var panel=ensureSaveTransferPanel(); panel.hidden=false;
          }, true); // Capture phase overrides app Cloud listener
        }
      }

      window.addEventListener('load', function () {
        initHandlers();
        setInterval(initHandlers, 1000);
      });
    })();

  <script>
    // Team & PC Touch-Hold (Bấm giữ) to move to Team / Return to PC
    (function () {
      let holdTimer = null;
      let didLongPress = false;
      let startX = 0, startY = 0;
      let targetCell = null;

      function clearHold() {
        if (holdTimer) {
          clearTimeout(holdTimer);
          holdTimer = null;
        }
        if (targetCell) {
          targetCell.classList.remove('holding');
          targetCell = null;
        }
      }

      function syncActiveTeam(Game) {
        if (!Game?.S?.team) return;
        var sets = Game.S.teamSets;
        if (sets?.list && Number.isInteger(sets.on) && sets.on >= 0) {
          sets.list[sets.on] = Game.S.team.slice();
        }
        Game.save();
        window.PokeCatch?.Screens?.team?.render?.();
        var refreshAdventureTeam = function () {
          window.PokeCatch?.Screens?.adventure?.refreshTeam?.();
          window.PokeCatch?.Screens?.adventure?.render?.();
        };
        refreshAdventureTeam();
        window.PokeCatch?.App?.refresh?.();
        requestAnimationFrame(refreshAdventureTeam);
        setTimeout(refreshAdventureTeam, 120);
      }

      document.addEventListener('click', function (e) {
        var adventureLink = e.target.closest('[data-screen="adventure"], [data-go="adventure"], a[href="#adventure"]');
        if (!adventureLink) return;
        setTimeout(function () {
          window.PokeCatch?.Screens?.adventure?.refreshTeam?.();
          window.PokeCatch?.Screens?.adventure?.render?.();
        }, 0);
      }, true);

      document.addEventListener('pointerdown', function (e) {
        const pcCell = e.target.closest('#pc-grid .pc-cell:not(.ug-out)');
        const teamSlot = e.target.closest('#team-slots .slot.filled');

        if (!pcCell && !teamSlot) return;

        targetCell = pcCell || teamSlot;
        startX = e.clientX;
        startY = e.clientY;
        const currentPointerId = e.pointerId;
        didLongPress = false;

        targetCell.classList.add('holding');

        clearTimeout(holdTimer);
        holdTimer = setTimeout(function () {
          didLongPress = true;
          if (targetCell) targetCell.classList.remove('holding');

          const uid = targetCell ? targetCell.dataset.uid : null;
          if (!uid || !window.PokeCatch?.Game) return;

          const Game = window.PokeCatch.Game;
          const S = Game.S;
          if (!S || !S.team) return;

          // Dispatch pointercancel to release engine drag Ct
          try {
            document.dispatchEvent(new PointerEvent('pointercancel', { bubbles: true, cancelable: true, pointerId: currentPointerId }));
          } catch (err) {}

          const mon = Game.getMon(uid);
          const monName = mon ? (window.PokeCatch.CONFIG?.DEX?.[mon.id]?.name || mon.name || 'Pokémon') : 'Pokémon';

          if (pcCell) {
            // Bấm giữ trong PC -> Đưa vào đội hình
            if (S.team.includes(uid)) {
              window.PokeCatch.UI?.toast?.(monName + ' is already in your team!');
              return;
            }
            if (S.team.length < 6) {
              S.team.push(uid);
              syncActiveTeam(Game);
              window.PokeCatch.Sfx?.buy?.();
              try { navigator.vibrate?.([20, 40]); } catch (err) {}
              window.PokeCatch.UI?.toast?.('✓ ' + monName + ' added to Team!');
            } else {
              window.PokeCatch.UI?.toast?.('Team is full (6/6)! Hold a member to remove.');
            }
          } else if (teamSlot) {
            // Bấm giữ trong Đội -> Cất về PC
            const idx = S.team.indexOf(uid);
            if (idx >= 0) {
              if (S.team.length <= 1) {
                window.PokeCatch.UI?.toast?.('Must keep at least 1 Pokémon in team!');
                return;
              }
              S.team.splice(idx, 1);
              syncActiveTeam(Game);
              window.PokeCatch.Sfx?.buy?.();
              try { navigator.vibrate?.([20, 40]); } catch (err) {}
              window.PokeCatch.UI?.toast?.('✓ ' + monName + ' returned to PC!');
            }
          }
        }, 320);
      }, true);

      document.addEventListener('pointermove', function (e) {
        if (holdTimer && Math.hypot(e.clientX - startX, e.clientY - startY) > 10) {
          clearHold();
        }
      }, true);

      document.addEventListener('pointerup', function (e) {
        if (didLongPress) {
          try {
            window.PokeCatch.Screens?.team?.render();
          } catch (err) {}
        }
        clearHold();
      }, true);

      document.addEventListener('pointercancel', clearHold, true);

      document.addEventListener('click', function (e) {
        if (didLongPress) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          setTimeout(() => { didLongPress = false; }, 50);
        }
      }, true);

      // Enhance MonDetail modal with direct Team / PC action button
      const modalObserver = new MutationObserver(function () {
        const modal = document.querySelector('.dexcard.mon-card');
        if (!modal) return;

        // The game calculates HP/Attack/Defense/Sp.Atk/Sp.Def/Speed using the
        // species' base stats, this Pokémon's level and its nature. Keep the
        // complete panel expanded immediately, matching the supplied sample.
        const statsSlot = modal.querySelector('.stats-slot');
        const statsPanel = statsSlot && statsSlot.closest('details.dc-sec');
        if (statsPanel) {
          statsPanel.open = true;
          statsPanel.classList.add('team-stats-panel');
        }

        if (modal.querySelector('.mon-team-action-btn')) return;

        const dcSum = modal.querySelector('.dc-sum');
        if (!dcSum) return;

        const S = window.PokeCatch?.Game?.S;
        const monName = modal.querySelector('h2')?.innerText?.trim() || 'Pokémon';
        const inTeam = S?.team?.some(function (u) {
          const m = window.PokeCatch.Game.getMon(u);
          return m && m.name === monName;
        });

        const btn = document.createElement('button');
        btn.className = 'btn small gold mon-team-action-btn';
        btn.style.marginRight = '8px';
        btn.style.fontSize = '11px';
        btn.style.fontWeight = '700';
        btn.style.padding = '3px 8px';
        btn.style.borderRadius = '14px';

        if (inTeam) {
          btn.textContent = 'Cất vào PC';
          btn.onclick = function (e) {
            e.stopPropagation();
            const u = S.team.find(function (id) {
              const m = window.PokeCatch.Game.getMon(id);
              return m && m.name === monName;
            });
            if (u && S.team.length > 1) {
              S.team.splice(S.team.indexOf(u), 1);
              syncActiveTeam(window.PokeCatch.Game);
              window.PokeCatch.Sfx?.buy?.();
              window.PokeCatch.UI?.toast?.('✓ ' + monName + ' returned to PC!');
              modal.querySelector('.dc-x')?.click();
            } else {
              window.PokeCatch.UI?.toast?.('Must keep at least 1 Pokémon in team!');
            }
          };
        } else {
          btn.textContent = '+ Vào Đội';
          btn.onclick = function (e) {
            e.stopPropagation();
            const allMons = window.PokeCatch.Game.ownedMons ? window.PokeCatch.Game.ownedMons() : (S.mons || []);
            const m = allMons.find(function (x) {
              return x.name === monName && !S.team.includes(x.uid);
            });
            if (m && S.team.length < 6) {
              S.team.push(m.uid);
              syncActiveTeam(window.PokeCatch.Game);
              window.PokeCatch.Sfx?.buy?.();
              window.PokeCatch.UI?.toast?.('✓ ' + monName + ' added to Team!');
              modal.querySelector('.dc-x')?.click();
            } else if (S.team.length >= 6) {
              window.PokeCatch.UI?.toast?.('Team is full (6/6)! Hold a member to remove.');
            }
          };
        }

        dcSum.prepend(btn);
      });

      modalObserver.observe(document.body, { childList: true, subtree: true });
    })();
  </script>

  <script>
    // In-game Canvas Sprite enhancement for .dc-hero & borderless display
    window.addEventListener('load', function () {
      if (typeof CanvasPokemonEngine === 'undefined') return;

      // Every Kanto Pokémon has a verified Walk sheet. Some Idle rows use a
      // tight square/front frame that looks like a face portrait, so Pokédex
      // always uses the full-body Walk animation for Gen 1 (#001-#151).
      function pokedexAnimFor(id) {
        return id >= 1 && id <= 151 ? 'Walk' : 'Idle';
      }

      function syncPokedexShinyMode() {
        var button = document.getElementById('dex-shiny');
        var screen = document.getElementById('screen-pokedex');
        var shiny = !!button?.classList.contains('on');
        screen?.classList.toggle('shiny-mode', shiny);
        document.querySelectorAll('#dex-regions canvas').forEach(function (canvas) {
          canvas._pokePlayer?.setShiny(shiny);
        });
      }

      document.addEventListener('click', function (event) {
        if (!event.target.closest('#dex-shiny')) return;
        setTimeout(syncPokedexShinyMode, 0);
      });

      // DexCard hero shiny sync
      document.addEventListener('click', function (e) {
        var dcShinyBtn = e.target.closest('.dc-shiny');
        if (dcShinyBtn) {
          setTimeout(function () {
            var hero = document.querySelector('.dc-hero');
            var canvas = hero && hero.querySelector('canvas');
            if (canvas && canvas._pokePlayer) {
              var isShiny = dcShinyBtn.classList.contains('on');
              canvas._pokePlayer.setShiny(isShiny);
            }
          }, 0);
        }
      });


      function attachDexCell(cell) {
        if (cell.classList.contains('canvas-ready') || cell.closest('.dex-region[hidden]')) return;
        var sprbox = cell.querySelector('.sprbox');
        var img = sprbox && sprbox.querySelector('img');
        if (!img) return;
        var id = parseInt(cell.dataset.id, 10);
        if (!id) {
          var match = (img.getAttribute('src') || '').match(/(\d+)\.(gif|png)/);
          if (match) id = parseInt(match[1], 10);
        }
        if (!id) return;

        cell.classList.add('canvas-ready');
        var canvas = document.createElement('canvas');
        canvas.className = 'pokemon-sprite-mini';
        canvas.style.display = 'none';
        canvas.style.margin = 'auto';
        CanvasPokemonEngine.attachPlayer(canvas, {
          dex: id,
          isShiny: !!document.getElementById('screen-pokedex')?.classList.contains('shiny-mode'),
          anim: pokedexAnimFor(id),
          scale: 1.2,
          onFirstDraw: function () {
            canvas.style.display = 'block';
            img.style.display = 'none';
          }
        });
        sprbox.appendChild(canvas);
      }


      function monForElement(element) {
        var uid = element?.closest?.('[data-uid]')?.dataset?.uid;
        if (!uid) return null;
        try { return window.PokeCatch?.Game?.getMon?.(uid) || null; } catch (_) { return null; }
      }

      function isShinyElement(element, img) {
        var mon = monForElement(element);
        if (mon) return !!mon.shiny;
        var src = img?.getAttribute?.('src') || '';
        return /(?:^|\/)shiny(?:\/|$)/i.test(src) ||
          !!element?.querySelector?.('.shiny-ico,.shiny-mk,.mon-sh') ||
          !!element?.classList?.contains('shiny');
      }

      function syncShinyMark(element, img) {
        var shiny = isShinyElement(element, img);
        var mark = element.querySelector(':scope > .shiny-head-mark');
        if (shiny && !mark) {
          mark = document.createElement('span');
          mark.className = 'shiny-head-mark';
          mark.textContent = '✨';
          mark.title = 'Shiny Pokémon · +10% chỉ số';
          element.appendChild(mark);
        } else if (!shiny) mark?.remove();
        return shiny;
      }

      // Load animated sheets only as cells approach the viewport. This keeps
      // every visible Pokémon moving without recreating the old all-regions
      // load spike when Pokédex opens.
      var dexAttachQueue = [], dexAttachScheduled = false;
      function flushDexAttachQueue() {
        dexAttachScheduled = false;
        var made = 0;
        while (dexAttachQueue.length && made < 3) {
          var cell = dexAttachQueue.shift();
          cell.classList.remove('dex-animation-pending');
          if (!cell.__dexNear || !cell.isConnected || cell.closest('.dex-region[hidden]')) continue;
          attachDexCell(cell); made++;
        }
        if (dexAttachQueue.length) {
          dexAttachScheduled = true;
          requestAnimationFrame(flushDexAttachQueue);
        }
      }
      function queueDexCell(cell) {
        if (cell.classList.contains('canvas-ready') || cell.classList.contains('dex-animation-pending')) return;
        cell.classList.add('dex-animation-pending');
        dexAttachQueue.push(cell);
        if (!dexAttachScheduled) { dexAttachScheduled = true; requestAnimationFrame(flushDexAttachQueue); }
      }
      function releaseDexCell(cell) {
        var canvas = cell.querySelector('canvas.pokemon-sprite-mini');
        if (!canvas) return;
        try { canvas._pokePlayer?.destroy?.(); } catch (_) {}
        canvas.remove();
        cell.querySelector('.sprbox img')?.style.removeProperty('display');
        cell.classList.remove('canvas-ready');
      }
      var dexCellObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          entry.target.__dexNear = entry.isIntersecting;
          if (entry.isIntersecting) queueDexCell(entry.target);
          else releaseDexCell(entry.target);
        });
      }, { rootMargin: '180px 0px' });

      // PC may contain hundreds of Pokémon. Creating one canvas player per
      // entry during Team/PC opening blocks the UI, so initialise only cards
      // that are close to the visible scroll area.
      function attachPcCell(cell) {
        if (cell.classList.contains('canvas-ready')) return;
        var sprbox = cell.querySelector('.sprbox');
        var img = sprbox && sprbox.querySelector('img');
        if (!img) return;
        var id = parseInt(img.dataset.id, 10);
        if (!id) {
          var match = (img.getAttribute('src') || '').match(/(\d+)\.(gif|png)/);
          if (match) id = parseInt(match[1], 10);
        }
        if (!id) return;
        cell.classList.add('canvas-ready');
        var canvas = document.createElement('canvas');
        canvas.className = 'pokemon-sprite-pc';
        canvas.style.display = 'none';
        canvas.style.margin = 'auto';
        CanvasPokemonEngine.attachPlayer(canvas, {
          dex: id,
          isShiny: syncShinyMark(cell, img),
          anim: 'Idle',
          scale: 1.7,
          onFirstDraw: function () {
            canvas.style.display = 'block';
            img.style.display = 'none';
          }
        });
        sprbox.appendChild(canvas);
      }

      var pcCellObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          pcCellObserver.unobserve(entry.target);
          attachPcCell(entry.target);
        });
      }, { root: document.getElementById('pc-grid'), rootMargin: '180px 0px' });

      // Team/PC is rebuilt after item use and evolution. Explicitly detach
      // players and observers from removed cards so repeated bulk actions do
      // not leave animation loops or DOM references alive in Android/iOS.
      function cleanupRemovedSpriteTree(root) {
        if (!root || root.nodeType !== 1) return;
        var cells = [];
        if (root.matches?.('.pc-cell')) cells.push(root);
        root.querySelectorAll?.('.pc-cell').forEach(function (cell) { cells.push(cell); });
        cells.forEach(function (cell) { try { pcCellObserver.unobserve(cell); } catch (_) {} });
        var dexCells = [];
        if (root.matches?.('.dex-cell')) dexCells.push(root);
        root.querySelectorAll?.('.dex-cell').forEach(function (cell) { dexCells.push(cell); });
        dexCells.forEach(function (cell) { try { dexCellObserver.unobserve(cell); } catch (_) {} });
        var canvases = [];
        if (root.matches?.('canvas')) canvases.push(root);
        root.querySelectorAll?.('canvas').forEach(function (canvas) { canvases.push(canvas); });
        canvases.forEach(function (canvas) {
          try { CanvasPokemonEngine.detachPlayer?.(canvas) || canvas._pokePlayer?.destroy?.(); } catch (_) {}
        });
      }
      new MutationObserver(function (records) {
        records.forEach(function (record) {
          record.removedNodes.forEach(cleanupRemovedSpriteTree);
        });
      }).observe(document.body, { childList:true, subtree:true });

      // Observe DOM changes to replace static hero images with interactive canvas
      var heroObserver = new MutationObserver(function (mutations) {
        // 1. DexCard hero modal
        // Team/PC detail modals already use the lightweight animated art from
        // the game bundle. Replacing that hero while its evolution tree is
        // mounting can cause repeated modal mutations and freeze the screen.
        var heroes = document.querySelectorAll('.dexcard:not(.mon-card) .dc-hero:not(.canvas-ready)');
        heroes.forEach(function (hero) {
          hero.classList.add('canvas-ready');
          var img = hero.querySelector('img.art');
          if (!img) return;

          var src = img.getAttribute('src') || '';
          var m = src.match(/(\d+)\.(gif|png)/);
          if (!m) return;
          var id = parseInt(m[1], 10);
          var isShiny = src.includes('shiny');

          var canvas = document.createElement('canvas');
          canvas.className = 'pokemon-sprite';
          canvas.style.display = 'none'; // Keep img visible until canvas paints!
          canvas.style.margin = 'auto';

          // Attach CanvasPlayer
          var player = CanvasPokemonEngine.attachPlayer(canvas, {
            dex: id,
            isShiny: isShiny,
            anim: pokedexAnimFor(id),
            scale: 2.5,
            onFirstDraw: function () {
              canvas.style.display = 'block';
              img.style.display = 'none';
            }
          });

          hero.appendChild(canvas);
        });

        // 2. Animate only the selected region, lazily around the viewport.
        var dexCells = document.querySelectorAll(
          '#dex-regions.dex-tabs-ready > .dex-region:not([hidden]) .dex-cell:not(.dex-animation-watched)'
        );
        dexCells.forEach(function (cell) {
          cell.classList.add('dex-animation-watched');
          dexCellObserver.observe(cell);
        });

        // 3. Team slots (.slot.filled)
        var teamSlots = document.querySelectorAll('#team-slots .slot.filled:not(.canvas-ready), #screen-team .slot.filled:not(.canvas-ready)');
        teamSlots.forEach(function (slot) {
          slot.classList.add('canvas-ready');
          var sprbox = slot.querySelector('.sprbox');
          if (!sprbox) return;
          var img = sprbox.querySelector('img');
          if (!img) return;

          var id = parseInt(img.dataset.id, 10);
          if (!id) {
            var m = (img.getAttribute('src') || '').match(/(\d+)\.(gif|png)/);
            if (m) id = parseInt(m[1], 10);
          }
          if (!id) return;
          var slotShiny = syncShinyMark(slot, img);

          // Mega sprite sheets now supported via CanvasPokemonEngine MEGA_SPRITE_MAP

          var canvas = document.createElement('canvas');
          canvas.className = 'pokemon-sprite-team';
          canvas.style.display = 'none';
          canvas.style.margin = 'auto';

          var player = CanvasPokemonEngine.attachPlayer(canvas, {
            dex: id,
            isShiny: slotShiny,
            anim: 'Idle',
            scale: 2.0,
            onFirstDraw: function () {
              canvas.style.display = 'block';
              img.style.display = 'none';
            }
          });

          sprbox.appendChild(canvas);
        });

        // 4. PC Grid cells: watch cheaply, create canvas only near viewport.
        var pcCells = document.querySelectorAll('#pc-grid .pc-cell:not(.canvas-watched), #screen-team .pc-cell:not(.canvas-watched)');
        pcCells.forEach(function (cell) {
          syncShinyMark(cell, cell.querySelector('.sprbox img'));
          cell.classList.add('canvas-watched');
          pcCellObserver.observe(cell);
        });
        document.querySelectorAll('#screen-team .pc-cell, #screen-team .slot.filled').forEach(function (cell) {
          syncShinyMark(cell, cell.querySelector('.sprbox img'));
        });

        // 5. Live battle sprites. Use the east-facing row so combatants show
        // a readable full-body silhouette instead of the front-facing square
        // frame that can look like a cropped portrait.
        var battlers = document.querySelectorAll(
          '#ally-slots .ally:not(.canvas-ready), #enemy-slots .enemy:not(.canvas-ready), ' +
          '.arena .ally:not(.canvas-ready), .arena .enemy:not(.canvas-ready)'
        );
        battlers.forEach(function (battler) {
          var img = battler.querySelector('.wrap > img, img');
          if (!img) return;
          var src = img.getAttribute('src') || img.dataset.src || '';
          var m = src.match(/pokemon\/(?:shiny\/)?(\d+)\.(?:gif|png)/);
          if (!m) return;

          var id = parseInt(m[1], 10);
          if (!id) return;
          battler.classList.add('canvas-ready');

          var canvas = document.createElement('canvas');
          canvas.className = 'pokemon-sprite-battle';
          canvas.style.display = 'none';
          canvas.style.margin = 'auto';

          CanvasPokemonEngine.attachPlayer(canvas, {
            dex: id,
            isShiny: src.includes('shiny'),
            anim: 'Idle',
            direction: 2,
            scale: 2.5,
            onFirstDraw: function () {
              canvas.style.display = 'block';
              img.style.display = 'none';
            }
          });

          (img.parentElement || battler).appendChild(canvas);
        });
      });

      
        // 6. Evolution chain animated sprites (including all Megas!)
        var evoCards = document.querySelectorAll('.evo-chain .evo:not(.canvas-ready)');
        evoCards.forEach(function (evo) {
          var sprbox = evo.querySelector('.sprbox');
          if (!sprbox) return;
          var img = sprbox.querySelector('img');
          if (!img) return;

          var id = parseInt(img.dataset.id, 10);
          if (!id) {
            var m = (img.getAttribute('src') || '').match(/(\d+)\.(gif|png)/);
            if (m) id = parseInt(m[1], 10);
          }
          if (!id) return;
          var detailCard = evo.closest('.mon-card');
          var heroImg = detailCard?.querySelector('.dc-hero img.art');
          var detailShiny = !!heroImg && /(?:^|\/)shiny(?:\/|$)/i.test(heroImg.getAttribute('src') || '');
          if (detailShiny) detailCard.classList.add('shiny-detail');
          if (window.PokeCatch?.MEGA?.isMega?.(id)) {
            evo.classList.toggle('unknown', !window.PokeCatch?.Game?.S?.dex?.[id]);
          }
          evo.classList.add('canvas-ready');

          var canvas = document.createElement('canvas');
          canvas.className = 'pokemon-sprite-mini';
          canvas.style.display = 'none';
          canvas.style.margin = 'auto';

          CanvasPokemonEngine.attachPlayer(canvas, {
            dex: id,
            isShiny: detailShiny || isShinyElement(evo, img),
            anim: 'Idle',
            scale: 3.35,
            onFirstDraw: function () {
              canvas.style.display = 'block';
              img.style.display = 'none';
            }
          });

          sprbox.appendChild(canvas);
        });

      heroObserver.observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['src', 'data-src', 'hidden']
      });

      // Play the actual Attack/Hurt sheets when the battle renderer marks a
      // target as hit. The previous canvas layer stayed on Idle for every
      // skill, which made attacks look delayed and jerky.
      var battleAnimTimers = new WeakMap();
      function playBattleAnim(element, animation, duration) {
        var player = element?.querySelector('canvas.pokemon-sprite-battle')?._pokePlayer;
        if (!player) return;
        clearTimeout(battleAnimTimers.get(element));
        player.setAnim(animation);
        battleAnimTimers.set(element, setTimeout(function () {
          player.setAnim('Idle');
        }, duration));
      }
      new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          var target = mutation.target;
          if (!target.classList?.contains('hit') || /(^|\s)hit(\s|$)/.test(mutation.oldValue || '')) return;
          var battler = target.matches?.('.ally,.enemy') ? target : target.closest?.('.ally,.enemy');
          if (!battler) return;
          playBattleAnim(battler, 'Hurt', 260);
          var arena = battler.closest('.arena, #screen-adventure') || document;
          var attacker = arena.querySelector(battler.classList.contains('enemy') ? '.ally' : '.enemy');
          playBattleAnim(attacker, 'Attack', 460);
        });
      }).observe(document.body, {
        subtree: true,
        attributes: true,
        attributeOldValue: true,
        attributeFilter: ['class']
      });
    });
  </script>

  <script>
    window.addEventListener('load',function(){
      var open=document.getElementById('admin-tools-btn'),appBtn=document.getElementById('app-download-btn'),panel=document.getElementById('admin-tools-panel'),close=panel.querySelector('.admin-close'),select=document.getElementById('admin-item'),status=document.getElementById('admin-status');
      var adminEnv={time:null,weather:null};
      
      function mountAdminButton() {
        var sleepButton=document.getElementById('sleep-btn');
        var topActions=sleepButton?.parentElement||document.querySelector('.topbar .tb-acts')||document.querySelector('.topbar');
        if(topActions) {
          if(appBtn && appBtn.parentElement !== topActions) {
            topActions.insertBefore(appBtn, sleepButton||null);
          }
          if(open && open.parentElement !== topActions) {
            topActions.insertBefore(open, appBtn||sleepButton||null);
          }
        }
      }
      mountAdminButton();
      setInterval(mountAdminButton, 500);

      function game(){return window.PokeCatch?.Game}
      function fillItems(){var names=window.PokeCatch?.ITEM_NAMES||{},current=select.value;select.replaceChildren(...Object.keys(names).sort(function(a,b){return String(names[a]).localeCompare(String(names[b]))}).map(function(key){var option=document.createElement('option');option.value=key;option.textContent=String(names[key])+' · '+key;return option}));if(current&&names[current])select.value=current}
      function paintEnvironment(){document.querySelectorAll('[data-admin-env]').forEach(function(b){var p=b.dataset.adminEnv.split(':');b.classList.toggle('on',b.dataset.adminEnv==='auto'?!adminEnv.time&&!adminEnv.weather:adminEnv[p[0]]===p[1])})}
      function environmentReady(P){return !!(P?.Game?.S?.adv?.nodes?.length&&P?.Adventure?.state)}
      function applyEnvironment(value,quiet){var P=window.PokeCatch,parts=String(value||'auto').split(':');if(parts[0]==='time')adminEnv.time=parts[1];else if(parts[0]==='weather')adminEnv.weather=parts[1];else adminEnv={time:null,weather:null};paintEnvironment();try{adminEnv.time||adminEnv.weather?localStorage.setItem('pokecatch.admin.environment',JSON.stringify(adminEnv)):localStorage.removeItem('pokecatch.admin.environment')}catch{}if(!quiet&&environmentReady(P)){if(parts[0]==='time')P.DAYTIME?.force?.(adminEnv.time);else if(parts[0]==='weather')P.WEATHER?.force?.(adminEnv.weather);else{P.DAYTIME?.force?.(null);P.WEATHER?.force?.(null)}}if(!quiet)status.textContent='Time: '+(adminEnv.time||'auto')+' · Weather: '+(adminEnv.weather||'auto')}

      function refreshRegionBounds() {
        var chs = window.PokeCatch && window.PokeCatch.STORY && window.PokeCatch.STORY.CHAPTERS;
        if (!chs || !chs.length) return;
        REGIONS_DATA.forEach(function(r) {
          var first = -1, last = -1;
          for (var i = 0; i < chs.length; i++) {
            var reg = chs[i].reg || 'kanto';
            if (reg === r.id) {
              if (first === -1) first = i;
              last = i;
            }
          }
          if (first >= 0) {
            r.firstCh = first;
            r.lastCh = last;
          }
        });
      }

      var REGIONS_DATA = [
        { id: 'kanto', name: 'Kanto', gen: 'Gen 1', firstCh: 0, lastCh: 13, color: '#ef4444' },
        { id: 'johto', name: 'Johto', gen: 'Gen 2', firstCh: 14, lastCh: 30, color: '#f59e0b' },
        { id: 'hoenn', name: 'Hoenn', gen: 'Gen 3', firstCh: 31, lastCh: 47, color: '#10b981' },
        { id: 'sinnoh', name: 'Sinnoh', gen: 'Gen 4', firstCh: 48, lastCh: 65, color: '#3b82f6' },
        { id: 'unys', name: 'Unys / Unova', gen: 'Gen 5', firstCh: 66, lastCh: 82, color: '#6366f1' },
        { id: 'kalos', name: 'Kalos', gen: 'Gen 6', firstCh: 83, lastCh: 99, color: '#ec4899' },
        { id: 'alola', name: 'Alola', gen: 'Gen 7', firstCh: 100, lastCh: 115, color: '#f97316' },
        { id: 'galar', name: 'Galar', gen: 'Gen 8', firstCh: 116, lastCh: 128, color: '#8b5cf6' },
        { id: 'paldea', name: 'Paldea', gen: 'Gen 9', firstCh: 129, lastCh: 146, color: '#14b8a6' },
      ];
      try { refreshRegionBounds(); } catch(e) {}

      function updateRegionUI() {
        try { refreshRegionBounds(); } catch(e) {}
        var P = window.PokeCatch, G = P?.Game, S = G?.S;
        var regSelect = document.getElementById('admin-region-select');
        var regBadge = document.getElementById('admin-reg-current');
        var grid = document.getElementById('admin-regions-grid');
        if (!regSelect || !grid) return;

        var curCh = S?.adv?.chapter || 0;
        var maxUnlocked = (S?.adv?.unlocked != null) ? S.adv.unlocked : 0;
        var currentReg = REGIONS_DATA[0];
        for (var i = 0; i < REGIONS_DATA.length; i++) {
          if (curCh >= REGIONS_DATA[i].firstCh && curCh <= REGIONS_DATA[i].lastCh) {
            currentReg = REGIONS_DATA[i];
            break;
          }
        }
        if (regBadge) regBadge.textContent = 'Đang ở: ' + currentReg.name;

        if (!regSelect.children.length) {
          REGIONS_DATA.forEach(function(r) {
            var opt = document.createElement('option');
            opt.value = r.id;
            opt.textContent = r.gen + ' · ' + r.name + ' (Ch.' + (r.firstCh + 1) + '-' + (r.lastCh + 1) + ')';
            regSelect.appendChild(opt);
          });
          regSelect.value = currentReg.id;
        }

        grid.innerHTML = '';
        REGIONS_DATA.forEach(function(r) {
          var isCurrent = (r.id === currentReg.id);
          var isUnlocked = (maxUnlocked >= r.firstCh);
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.style.cssText = 'padding:6px 3px; border-radius:6px; border:1px solid ' + (isCurrent ? '#ffd83b' : (isUnlocked ? '#3b82f6' : '#334155')) + '; background:' + (isCurrent ? '#3b2f0b' : (isUnlocked ? '#1e293b' : '#0f172a')) + '; color:' + (isCurrent ? '#ffcb05' : (isUnlocked ? '#e2e8f0' : '#64748b')) + '; font:700 10px system-ui; text-align:center; cursor:pointer;';
          btn.innerHTML = (isCurrent ? '📍 ' : (isUnlocked ? '✅ ' : '🔒 ')) + r.gen;
          btn.title = r.name + ' (Ch.' + (r.firstCh + 1) + '-' + (r.lastCh + 1) + ') - Bấm để đến ngay';
          btn.onclick = function() {
            goToRegion(r);
          };
          grid.appendChild(btn);
        });
      }

      function goToRegion(reg) {
        var P = window.PokeCatch, G = P?.Game, S = G?.S, A = P?.Adventure;
        if (!G || !S) {
          status.textContent = 'Chưa sẵn sàng!';
          return;
        }
        A?.ensure?.();
        if (!S.adv) S.adv = { chapter: 0, unlocked: 0, nodes: [], node: 0 };
        if (S.adv.unlocked < reg.firstCh) {
          S.adv.unlocked = reg.firstCh;
        }
        if (Array.isArray(S.team) && S.team.length === 0) {
          var starterMap = { kanto: 1, johto: 152, hoenn: 252, sinnoh: 387, unys: 495, kalos: 650, alola: 722, galar: 810, paldea: 906 };
          var sid = starterMap[reg.id] || 1;
          var lvl = Math.max(5, (reg.firstCh + 1) * 2);
          if (typeof G.makeMon === 'function' && typeof G.receive === 'function') {
            var newMon = G.makeMon(sid, lvl);
            if (newMon) {
              G.receive(newMon);
              if (newMon.uid && !S.team.includes(newMon.uid)) S.team.push(newMon.uid);
            }
          }
        }
        document.body.classList.remove('titled');
        if (P.Screens?.adventure?.goChapter) {
          P.Screens.adventure.goChapter(reg.firstCh);
        } else {
          S.adv.chapter = reg.firstCh;
          S.adv.node = 0;
          if (A) {
            A.state = 'route';
            A.cur = { chapter: reg.firstCh, node: 0, type: 'route', steps: 0, need: 10 };
          }
          P.Screens?.show?.('adventure');
        }
        G.save?.();
        P.App?.refresh?.();
        status.textContent = '🚀 Đã chuyển đến ' + reg.gen + ' (' + reg.name + ')!';
        updateRegionUI();
      }

      function unlockRegion(reg) {
        var P = window.PokeCatch, G = P?.Game, S = G?.S, A = P?.Adventure;
        if (!G || !S) return;
        A?.ensure?.();
        if (!S.adv) S.adv = { chapter: 0, unlocked: 0, nodes: [], node: 0 };
        if (S.adv.unlocked < reg.lastCh) {
          S.adv.unlocked = reg.lastCh;
          G.save?.();
          P.App?.refresh?.();
          status.textContent = '🔓 Đã mở khóa vùng ' + reg.name + ' (đến Ch.' + (reg.lastCh + 1) + ')!';
          updateRegionUI();
        } else {
          status.textContent = 'Vùng ' + reg.name + ' đã được mở khóa!';
        }
      }

      open.onclick=function(){
        fillItems();
        updateRegionUI();
        panel.hidden=false;
        status.textContent='';
      };
      close.onclick=function(){panel.hidden=true};
      panel.onclick=function(event){if(event.target===panel)panel.hidden=true};

      // Region buttons event listeners
      document.getElementById('admin-unlock-all-btn').onclick = function() {
        var P = window.PokeCatch, G = P?.Game, S = G?.S;
        if (!G || !S) return;
        P.Adventure?.ensure?.();
        if (!S.adv) S.adv = { chapter: 0, unlocked: 0, nodes: [], node: 0 };
        var maxCh = (P?.STORY?.CHAPTERS?.length ? P.STORY.CHAPTERS.length - 1 : 146);
        S.adv.unlocked = maxCh;
        var allBadges = [];
        if (P?.STORY?.CHAPTERS) {
          P.STORY.CHAPTERS.forEach(function(c) {
            if (c.steps) c.steps.forEach(function(s) { if (s.badge && !allBadges.includes(s.badge)) allBadges.push(s.badge); });
          });
        }
        if (!allBadges.length) {
