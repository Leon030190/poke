<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Poke'Catch (Offline Local Edition)</title>
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAyUlEQVRYw+2WuxHDIBAFVQptqAXCC90KIS04VHitECpUShmkz4mRTxbybw489vBmNt7VdxiGvr6+X5wxBiWaiXEei1QNeSSWxNOoH7HKlystIzbyvOV5gFrEVwN2z/2NR6AS8eqLdyT/j4DJfi6frEKAJdpEWKKVI3GWWyKdAAlzAAAwB1iiolSi8iU4529XLXYvkzjn9f4DcU4AAOf87g6UxHFOYA66f0MZkYlzKqIqlxHM4VCaxVXkMiKHlGh+Lmh+IOnr66uxC/l3fuTHPGsLAAAAAElFTkSuQmCC">
  <style>
    html, body { margin: 0; background: #12141c; color: #e8ecf4; font-family: system-ui, sans-serif; }
    html[data-theme="light"], html[data-theme="light"] body { background: #e8ecf4; color: #1b2133; }
    #boot-fail { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
    #boot-fail button { font: inherit; padding: 10px 20px; border-radius: 10px; border: 0; background: #ffcb05; color: #12141c; font-weight: 700; cursor: pointer; }
  </style>
  <script>
    window.SW_REG = Promise.resolve();
    // Auto-seed full game save with all Gen 1-9 & Megas
    try {
      var currentSave = null;
      try { currentSave = JSON.parse(localStorage.getItem('gachamon-save-v1')); } catch (e) {}
      if (!currentSave || !currentSave.mons || currentSave.mons.length < 1195 || !currentSave.adv || !Array.isArray(currentSave.adv.nodes)) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/data/default_full_save.json', false);
        xhr.send();
        if (xhr.status === 200 && xhr.responseText) {
          localStorage.setItem('gachamon-save-v1', xhr.responseText);
          console.log("✓ Pre-seeded all 1195 Pokémon and forms into local save!");
        }
      }
    } catch (e) {
      console.warn("Save pre-seed fallback:", e);
    }

    window.grantAllNewMons = function() {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/data/default_full_save.json', false);
        xhr.send();
        if (xhr.status === 200 && xhr.responseText) {
          var fullData = JSON.parse(xhr.responseText);
          var G = window.PokeCatch?.Game;
          if (G && G.S) {
            G.S.money = 9999999;
            G.S.items = Object.assign(G.S.items || {}, fullData.items);
            G.S.seen = Object.assign(G.S.seen || {}, fullData.seen);
            G.S.dex = Object.assign(G.S.dex || {}, fullData.dex);
            var existingUids = new Set(G.S.mons.map(function(m){ return m.id; }));
            for (var i = 0; i < fullData.mons.length; i++) {
              if (!existingUids.has(fullData.mons[i].id)) {
                G.S.mons.push(fullData.mons[i]);
              }
            }
            if (!G.S.team || G.S.team.length === 0) {
              G.S.team = fullData.team;
            }
            if (!G.S.adv) {
              G.S.adv = fullData.adv;
            }
            G.save();
            if (window.PokeCatch.App) {
              window.PokeCatch.App.refresh();
              window.PokeCatch.App.refreshHeader();
              window.PokeCatch.App.show("team");
            }
            document.body.classList.remove('titled');
            var titleEl = document.querySelector('.ti-root, .start-overlay');
            if (titleEl) titleEl.remove();
            alert("✓ Đã nạp thành công toàn bộ 1.195 Pokémon và các dạng vào PC!");
          } else {
            localStorage.setItem('gachamon-save-v1', xhr.responseText);
            location.reload();
          }
        }
      } catch (err) {
        alert("Lỗi khi nạp Pokémon: " + err.message);
      }
    };

    window.BOOT_FAIL = function () {
      if (document.getElementById('boot-fail')) return;
      var box = document.createElement('div'), p = document.createElement('p'), b = document.createElement('button');
      box.id = 'boot-fail'; p.textContent = 'Game load failed in offline mode.'; b.textContent = 'Retry';
      b.onclick = function () { location.reload(); };
      box.appendChild(p); box.appendChild(b);
      (document.body || document.documentElement).appendChild(box);
    };
  </script>
  <script src="./boot.local.js" onerror="BOOT_FAIL()"></script>
  <style>
    .game-control-bar {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 999999;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .fab-btn {
      color: #fff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      border: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .fab-btn.gold {
      background: linear-gradient(135deg, #e3a008, #d97706);
      color: #12141c;
      box-shadow: 0 4px 16px rgba(227, 160, 8, 0.4);
    }
    .fab-btn.blue {
      background: linear-gradient(135deg, #1f6feb, #238636);
    }
    .fab-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
  </style>
  <script>
    // Auto-switch to screen if hash or query present
    window.addEventListener('load', function () {
      function checkScreen() {
        var screen = (location.hash || '').replace('#', '') || new URLSearchParams(location.search).get('screen');
        if (screen) {
          var btn = document.querySelector('#tabs [data-screen="' + screen + '"]');
          if (btn) {
            btn.click();
          } else {
            setTimeout(checkScreen, 500);
          }
        }
      }
      setTimeout(checkScreen, 1500);
    });
  </script>

  <link rel="stylesheet" href="css/borderless_sprites.css">
  <script src="js/canvas_sprite_engine.js"></script>
</head>
<body>

  <div class="game-control-bar">
    <button class="fab-btn gold" onclick="window.grantAllNewMons()">
      ⚡ Nạp 728 Pokémon Gen 5-9 & Mega vào Game
    </button>
    <a href="./data_explorer.html" target="_blank" class="fab-btn blue">
      📊 Tra cứu Database (1,212 Pokémon)
    </a>
  </div>

  <script>
    // In-game Canvas Sprite enhancement for .dc-hero & borderless display
    window.addEventListener('load', function () {
      if (typeof CanvasPokemonEngine === 'undefined') return;

      // Universal Canvas Sprite Engine Hook for Poke'Catch
      // Replaces ALL static images across Pokédex, Team, PC Box, Battle, and Modals
      var heroObserver = new MutationObserver(function (mutations) {
        // 1. DexCard hero modal
        var heroes = document.querySelectorAll('.dc-hero:not(.canvas-ready)');
        heroes.forEach(function (hero) {
          hero.classList.add('canvas-ready');
          var img = hero.querySelector('img.art');
          if (!img) return;

          var src = img.getAttribute('src') || '';
          var m = src.match(/(\d+)\.(gif|png)/);
          if (!m) return;
          var id = parseInt(m[1], 10);
          var isShiny = src.includes('shiny');

          var canvas = document.createElement('canvas');
          canvas.className = 'pokemon-sprite';
          canvas.style.display = 'none';
          canvas.style.margin = 'auto';

          CanvasPokemonEngine.attachPlayer(canvas, {
            dex: id,
            isShiny: isShiny,
            anim: 'Idle',
            scale: 2.5,
            onFirstDraw: function () {
              canvas.style.display = 'block';
              img.style.display = 'none';
            }
          });

          hero.appendChild(canvas);
        });

        // 2. Universal Sprbox hook (covers Pokédex, Team, PC Box, Adventure, Modals)
        var boxes = document.querySelectorAll('.sprbox:not(.canvas-ready)');
        boxes.forEach(function (box) {
          box.classList.add('canvas-ready');
          var img = box.querySelector('img');
          if (!img) return;

          var id = parseInt(img.dataset.id || box.closest('[data-id]')?.dataset.id || box.closest('.dex-cell')?.dataset.id, 10);
          if (!id) {
            var src = img.getAttribute('src') || '';
            var m = src.match(/(\d+)\.(gif|png)/);
            if (m) id = parseInt(m[1], 10);
          }
          if (!id) return;

          var isShiny = (img.getAttribute('src') || '').includes('shiny');
          var isMini = box.closest('.dex-cell') || box.closest('.pc-cell');
          var scale = isMini ? 1.2 : 1.8;

          var canvas = document.createElement('canvas');
          canvas.className = isMini ? 'pokemon-sprite-mini' : 'pokemon-sprite-team';
          canvas.style.display = 'none';
          canvas.style.margin = 'auto';

          CanvasPokemonEngine.attachPlayer(canvas, {
            dex: id,
            isShiny: isShiny,
            anim: 'Idle',
            scale: scale,
            onFirstDraw: function () {
              canvas.style.display = 'block';
              img.style.display = 'none';
            }
          });

          box.appendChild(canvas);
        });
      });

      heroObserver.observe(document.body, { childList: true, subtree: true });
    });
  </script>

</body>
</html>
